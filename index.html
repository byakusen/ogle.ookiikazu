        var hidden = '<div style="visibility:hidden">' +
                     buildGrid({ cells:CN, digits:'', mark:-1 }) + '</div>';
        // たし算・ひき算の ヒントは、その 空けた ところに 筆算を かさねる（高さは かわらない）
        sp.innerHTML = (mHint && mType==='m4')
          ? '<div class="movl">'+hidden+'<div class="movlin">'+mFudeSvg()+'</div></div>'
          : hidden;
        sp.setAttribute('aria-hidden','true');
      }
    }else{
      sp.innerHTML = ''; sp.setAttribute('aria-hidden','true');
      // ヒントで きじゅんの 位（1万 など）を 赤い しかくで かこむ
      ciGrid('mgrid', stM, mHint, renderMake, mHint ? mHL : null);
    }
    ans.style.display = mIsCount ? '' : 'none';
    ans.placeholder = mUnit ? 'れい：8億' : 'れい：70';
    document.getElementById('unitPad').style.display = unitKeysOn() ? '' : 'none';
    document.getElementById('mnote').innerHTML = (mHint && mUnit) ? mHintTx : '';
    document.getElementById('mZeroBtn').style.display = mIsCount ? 'none' : '';
    document.getElementById('mreveal').textContent =
      mRevealed ? ('こたえ：'+(mUnit ? bigLabel(mAnswer) : String(mAnswer))) : '';
    var hb = document.getElementById('mHintBtn');
    hb.classList.toggle('on', mHint);
    hb.textContent = (mType==='m4') ? 'ヒント（筆算）' : 'ヒント（位を出す）';
  }

  /* =========================================================
     ④ 数直線
     ========================================================= */
  var NLU = [1e7, 1e8, 1e9, 1e10, 1e11];        // 1目もり
  var NLN = 50;                                  // 目じるしと目じるしの間の 目もりの数
  var NLEX = 4;                                  // 両はしの さきに つづく 小さい目もり
  var nlU = 1e10, nlStart = 5e11, nlArrow = 10, nlHint = false, nlRevealed = false;
  var nlCho = true;                              // 右の目じるしが 1兆 のとき

  function newNLArrow(){
    CH.newProblem();
    // 1兆の数直線のときは、3回に1回 やじるしを 1兆より右に
    if(nlCho && rnd(1,3)===1){
      nlArrow = rnd(NLN+1, NLN+NLEX);
      nlRevealed = false;
      return;
    }
    var cand = [];
    for(var i=-NLEX; i<=NLN+NLEX; i++){
      if(i===0 || i===NLN) continue;
      cand.push(i);
      if(i%10===0) cand.push(i);                 // 大きい目もりも 出やすく
      if(i<0 || i>NLN) cand.push(i);             // 目じるしの さきも 出やすく
    }
    nlArrow = pick(cand);
    nlRevealed = false;
  }
  var nlFirst = true;
  function newNL(){
    // はじめの1回と、3回に1回は テストと同じ「5000億 〜 1兆」
    if(nlFirst || rnd(1,3)===1){
      nlFirst = false;
      nlU = 1e10; nlStart = 5e11;                // 1目もり100億、右の目じるしが1兆
      nlCho = true;
    }else{
      nlU = pick(NLU);
      var kmax = (nlU>=1e11) ? 4 : 9;
      nlStart = nlU*10*rnd(1,kmax);              // 左の目じるし（5000億 など）
      nlCho = false;
    }
    nlHint = false;
    newNLArrow();
  }
  function nlValue(i){ return nlStart + i*nlU; }

  function renderNL(){
    var M=110, PX=(950-M)/NLN, baseY=124, s='';
    function X(i){ return M + i*PX; }
    // 線は 両はしの さきへ つづく
    s += '<line x1="'+(X(-NLEX)-26)+'" y1="'+baseY+'" x2="'+(X(NLN+NLEX)+26)+'" y2="'+baseY+'" stroke="var(--line)" stroke-width="3.5"/>';
    for(var i=-NLEX; i<=NLN+NLEX; i++){
      var major=(i%10===0), medium=(i%5===0);
      var top = major ? baseY-32 : (medium ? baseY-22 : baseY-14);
      var sw  = major ? 3 : (medium ? 1.9 : 1.2);
      s += '<line x1="'+X(i)+'" y1="'+top+'" x2="'+X(i)+'" y2="'+baseY+'" stroke="var(--line)" stroke-width="'+sw+'"/>';
    }
    for(var m=0;m<=NLN;m+=10){
      var isLbl = (m===0 || m===NLN);
      if(!isLbl && !nlHint) continue;
      s += '<text x="'+X(m)+'" y="'+(baseY-44)+'" text-anchor="middle" font-size="'+(isLbl?27:20)+'" font-weight="800" fill="'+(isLbl?'var(--ink)':'var(--hintlbl)')+'">'+bigLabel(nlValue(m))+'</text>';
    }
    var ax = X(nlArrow);
    s += '<line x1="'+ax+'" y1="'+(baseY+42)+'" x2="'+ax+'" y2="'+(baseY+10)+'" stroke="var(--arrow)" stroke-width="5" stroke-linecap="round"/>';
    s += '<path d="M '+(ax-11)+' '+(baseY+18)+' L '+(ax+11)+' '+(baseY+18)+' L '+ax+' '+(baseY+4)+' Z" fill="var(--arrow)"/>';
    s += '<text x="'+ax+'" y="'+(baseY+72)+'" text-anchor="middle" font-size="26" font-weight="900" fill="var(--arrow)">?</text>';
    if(nlRevealed){
      s += '<text x="'+ax+'" y="'+(baseY-70)+'" text-anchor="middle" font-size="26" font-weight="900" fill="var(--red)">'+bigLabel(nlValue(nlArrow))+'</text>';
    }
    document.getElementById('nl').innerHTML = s;
    document.getElementById('nlq').innerHTML =
      '↑ の 目もりは いくつ？　<span class="u">いちばん 小さい 1目もりは '+bigLabel(nlU)+' です。</span>';
    document.getElementById('nlreveal').textContent =
      nlRevealed ? ('こたえ：'+bigLabel(nlValue(nlArrow))+'（'+String(nlValue(nlArrow))+'）') : '';
    document.getElementById('nHintBtn').classList.toggle('on', nlHint);
  }

  /* =========================================================
     ⑤ 10倍・100倍・1/10
     ========================================================= */
  var xOp='x10', xRand=false, xBase=5600000000, xHint=false, xRevealed=false;

  // テストと同じ「56億・7000億・40億・2兆」のような きりのいい数をつくる。
  // 問題も こたえも「◯億」「◯兆」の 一まとまりに なる 組みあわせだけを 使う。
  // ［けた数, 0のかず］  けた数2 は 56億 のような 2けたの数
  var XC = {
    x10: { all:[[1,7],[1,8],[1,9],[1,10],[1,11],[2,8],[2,9]],
           cross:[[1,7],[1,11]] },        // 8000万→8億 / 7000億→7兆
    d10: { all:[[1,8],[1,9],[1,10],[1,11],[1,12],[2,9],[2,10]],
           cross:[[1,8],[1,12]] }         // 3億→3000万 / 5兆→5000億
  };
  function newMul(op){
    CH.newProblem();
    op = op || xOp;
    var t = XC[op] || XC.x10;
    // 3回に1回は 位が かわる問題（そのときは かならず 1けたの数）
    var c = (rnd(1,3)===1) ? pick(t.cross) : pick(t.all);
    var la = c[0], e = c[1];
    var a = (la===2) ? (rnd(1,9)*10 + rnd(1,9)) : rnd(1,9);
    xBase = a * pow10(e);
    xHint=false; xRevealed=false; xTypedCls='';
  }

  function xAnswer(){ return (xOp==='x10') ? xBase*10 : xBase/10; }
  var xTypedCls = '';                    // こたえ枠の 色（''／'ok'／'ng'）
  function xOpLabel(){ return (xOp==='x10') ? '10倍した数' : '1/10 にした数'; }
  function renderMul(){
    document.getElementById('xq').innerHTML =
      'つぎの数を <span style="color:var(--red)">'+xOpLabel()+'</span>を 書きましょう。';
    document.getElementById('xnum').textContent = bigLabel(xBase);
    var typed = document.getElementById('xtyped');
    typed.textContent = ans.value;
    typed.className = xTypedCls;
    ans.style.display = '';
    document.getElementById('unitPad').style.display = unitKeysOn() ? '' : 'none';

    var note = document.getElementById('xnote');
    if(xHint){
      note.innerHTML = bigLabel(xBase)+' ＝ '+String(xBase)+'<br>' + ((xOp==='d10')
        ? '1/10 に すると、位は <b>1つ 右</b> へ うつり、0 が 1こ へります。'
        : '10倍すると、位は <b>1つ 左</b> へ うつり、0 が 1こ ふえます。');
    }else{ note.textContent=''; }

    // ヒントの 位取り表。出ていない ときも 同じ 高さを あけておくので、
    // ヒントを 出しても 問題文や チップ列は うごかない
    document.getElementById('xspace').innerHTML = xHint
      ? buildGrid({ cells:CN, digits:String(xBase), units:true, mark:-1 })
      : '<div style="visibility:hidden">'+buildGrid({ cells:CN, digits:'', mark:-1 })+'</div>';

    document.getElementById('xreveal').textContent =
      xRevealed ? ('こたえ：'+bigLabel(xAnswer())+'（'+String(xAnswer())+'）') : '';
    document.getElementById('xHintBtn').classList.toggle('on', xHint);
    Array.prototype.forEach.call(document.querySelectorAll('#xops button'), function(b){
      var op=b.getAttribute('data-op');
      b.classList.toggle('on', xRand ? (op==='rand') : (op===xOp));
    });
  }

  /* =========================================================
     ⑥ かけ算の筆算（見せる筆算）
       ・かける数を タップ → その段が 1けたずつ 書かれていく
       ・2だんめからは、先に「ゆうれいの 0ちゃん」を 自分で 書く
         （十の位なら 1つ、百の位なら 2つ。0のキーを おす）
       ・青い矢印で「どの数と どの数を かけるか」を 見せる
       ・繰り上がりは マスの 中の 右上に 小さい数字
       ・かける数に 0 が あっても 段は とばさない（0×3 も 書く）
       ・ぜんぶ そろったら 一の位から たてに たす
     ========================================================= */
  var FC = 50, FH = 56;                  // 筆算の 1マスの 大きさ
  var fType='f3', fRand=false, fHint=false, fRevealed=false, stF=null;
  var FNUM = ['①','②','③','④','⑤'];
  // アニメーションの はやさ（ms）
  var FSPD = { arrow:460, carry:360, digit:500, col:400, gap:560, line:560 };
  var fTimer = null;
  function fStop(){ if(fTimer){ clearTimeout(fTimer); fTimer=null; }
                    if(typeof fxStop==='function') fxStop(); }

  function fd3(){ return rnd(1,9)*100 + rnd(1,9)*10 + rnd(1,9); }

  // 1つの段（文字列を そのまま マスに 入れる）
  function fRowStr(cols, str, shift, kind, extra){
    var exp=[], right=cols-1-shift, c;
    for(c=0;c<cols;c++) exp.push('');
    for(var i=0;i<str.length;i++){
      var c2 = right - str.length + 1 + i;
      if(c2>=0 && c2<cols) exp[c2]=str.charAt(i);
    }
    var o = { kind:kind, shift:shift, exp:exp, digit:0, dsh:0, ghost:0 };
    if(extra) for(var k in extra) o[k]=extra[k];
    return o;
  }
  // a × d を 1けたずつ 計算した 文字列（d が 0 なら 000… に なる）
  function fMulDigits(a, d){
    var as=String(a), out=[], carry=0, i, p;
    for(i=0;i<as.length;i++){
      p = Number(as.charAt(as.length-1-i))*d + carry;
      out.unshift(String(p%10)); carry = Math.floor(p/10);
    }
    if(carry>0) out.unshift(String(carry));
    return out.join('');
  }

  // ra×rb を 筆算する。pa・qb は もとの数に ついていた 0 の数
  function fMakeState(ra, rb, pa, qb){
    pa = pa||0; qb = qb||0;
    var zeros = pa + qb, prod = ra*rb, fin = prod*pow10(zeros);
    var cols = String(fin).length + 1;
    var bd = String(rb), m = bd.length, rows = [], j;
    if(m>=2){
      for(j=0;j<m;j++){
        var d = Number(bd.charAt(m-1-j));
        var s = fMulDigits(ra, d) + new Array(j+1).join('0');   // うしろに ゆうれいの0
        rows.push(fRowStr(cols, s, zeros, 'pp', { digit:d, dsh:j, ghost:j }));
      }
    }
    // こたえは 1行だけ。くふうの ときは 右の 0を あとから 自分で 入れる
    rows.push(fRowStr(cols, String(fin), 0, 'sum', { tail:zeros }));
    var cells = [];
    for(var r=0;r<rows.length;r++){
      var line=[]; for(var c=0;c<cols;c++) line.push(''); cells.push(line);
    }
    var st = { ra:ra, rb:rb, pa:pa, qb:qb, zeros:zeros, base:zeros,
               prod:prod, fin:fin, cols:cols, rows:rows, cells:cells,
               carries:[], arrows:[], ghosts:{}, hi:-1, last:null, sumLine:false,
               seq:[], pi:0, ai:0, stage:'pick', done:false };
    st.seq = fPhases(st);
    st.stage = st.seq[0] ? (st.seq[0].kind==='mul' ? 'pick'
                          : st.seq[0].kind==='ghost' ? 'ghost' : 'run') : 'run';
    return st;
  }

  var FKETA = ['一','十','百','千'];
  function fGhostMsg(j){
    return 'つぎは '+FKETA[j]+'の位の かけ算。'+(j+1)+'だんめに「ゆうれいの 0ちゃん」を '+j+'つ 書こう。';
  }
  function fWriteMsg(st, d, j){
    return st.ra+' × '+d+' を'+(j===0 ? ' 計算します。' : '、ゆうれいの 0ちゃんの 左から 書いていきます。');
  }

  // 筆算を「手じゅん（phase）」に わける
  function fPhases(st){
    var as = String(st.ra), rightR = st.cols-1-st.base, seq=[], r, j;
    var ppIdx=[], sumIdx=-1;
    for(r=0;r<st.rows.length;r++){
      if(st.rows[r].kind==='pp') ppIdx.push(r);
      if(st.rows[r].kind==='sum') sumIdx=r;
    }

    // 1つの段を 右から じゅんに かける（ゆうれいの0の 左から 書く）
    function mulActs(rowIdx, d, ghost){
      var acts=[], carry=0, i, col, p, ch;
      var start = st.cols-1-st.base-ghost;
      for(i=0;i<as.length;i++){
        col = start - i;
        acts.push({ t:'arrow', c:rightR-i });
        p = Number(as.charAt(as.length-1-i))*d + carry;
        ch = p%10; carry = Math.floor(p/10);
        if(carry>0){
          if(i===as.length-1) acts.push({ t:'digit', r:rowIdx, c:col-1, ch:String(carry) });
          else acts.push({ t:'carry', r:rowIdx, c:col, v:carry });
        }
        acts.push({ t:'digit', r:rowIdx, c:col, ch:String(ch) });
      }
      return acts;
    }
    // ゆうれいの0ちゃん（右から じゅんに）
    function ghostActs(rowIdx, need){
      var acts=[];
      for(var i=0;i<need;i++) acts.push({ t:'ghost', r:rowIdx, c:st.cols-1-st.base-i });
      return acts;
    }
    // たてに たす
    function addActs(rowIdx, srcs){
      var acts=[], carry=0, c, k, s, ch, left=0, exp=st.rows[rowIdx].exp;
      for(c=0;c<st.cols;c++){ if(exp[c]!==''){ left=c; break; } }
      var right = st.cols-1-st.base;      // 0を つける 前の 右はし
      for(c=right;c>=left;c--){
        acts.push({ t:'col', c:c });
        s = carry;
        for(k=0;k<srcs.length;k++){
          var d0 = st.rows[srcs[k]].exp[c];
          if(d0!=='') s += Number(d0);
        }
        ch = s%10; carry = Math.floor(s/10);
        if(carry>0) acts.push({ t:'carry', r:rowIdx, c:c, v:carry });
        acts.push({ t:'digit', r:rowIdx, c:c, ch:String(ch) });
      }
      return acts;
    }
    // とった 0を こたえの 右に つける（子どもが 0を おす）
    function tailActs(rowIdx, need){
      var acts=[];   // こたえの すぐ右から 左→右に 書きたす
      for(var i=0;i<need;i++) acts.push({ t:'tail', r:rowIdx, c:st.cols-need+i });
      return acts;
    }

    var first = (st.zeros>0)
      ? 'くふうして 計算します。0を とった かける数を タップしよう。'
      : '最初に かける数を タップしよう。';

    if(ppIdx.length>=2){
      for(j=0;j<ppIdx.length;j++){
        r = ppIdx[j];
        if(j>0){
          seq.push({ kind:'ghost', row:r, mcol:rightR-j,
                     pick:fGhostMsg(j), msg:fGhostMsg(j), acts:ghostActs(r, j) });
        }
        seq.push({ kind:'mul', row:r, d:st.rows[r].digit, sh:j, mcol:rightR-j,
                   pick: (j===0) ? first : 'つぎに かける数を タップしよう。',
                   msg:  fWriteMsg(st, st.rows[r].digit, j),
                   acts: mulActs(r, st.rows[r].digit, j) });
      }
      // 部分積が そろったら、まず こたえの 線を 左から 右へ 引く
      seq.push({ kind:'add', row:sumIdx, msg:ppIdx.length+'だんの 答えを、一の位から たし算します。',
                 acts: [{ t:'line' }].concat(addActs(sumIdx, ppIdx)) });
    }else{
      var bd = String(st.rb), d1=0, sh1=0, dd;
      for(var i2=0;i2<bd.length;i2++){
        dd = Number(bd.charAt(bd.length-1-i2));
        if(dd!==0){ d1=dd; sh1=i2; }
      }
      seq.push({ kind:'mul', row:sumIdx, d:d1, sh:sh1, mcol: rightR - sh1,
                 pick: first, msg: fWriteMsg(st, d1, 0),
                 acts: mulActs(sumIdx, d1, sh1) });
    }
    if(st.zeros>0){
      seq.push({ kind:'ghost', row:sumIdx,
                 pick:'とった 0を '+st.zeros+'つ、こたえの 右に 書こう。',
                 msg: 'とった 0を '+st.zeros+'つ、こたえの 右に 書こう。',
                 acts: tailActs(sumIdx, st.zeros) });
    }
    return seq;
  }

  function newFude(kind){
    fStop();
    if(kind==='fx'){ newFx(); return; }
    CH.newProblem();
    fHint=false; fRevealed=false;
    if(kind==='fk'){
      // くふうして筆算（3400×60 / 450×2800 のような形）
      var ra=rnd(11,99), rb, pa, qb;
      if(rnd(0,1)===0){ rb=rnd(2,9); pa=rnd(1,2); qb=rnd(1,2); if(pa+qb>3) qb=1; }
      else{ do{ rb=rnd(11,99); }while(rb%10===0); pa=1; qb=rnd(1,2); }
      stF = fMakeState(ra, rb, pa, qb);
    }else{
      // 3けた×3けた（テストと同じ4パターン）
      var k=rnd(0,3), a, b;
      if(k===0){ a=fd3(); b=fd3(); }                          // 247×357
      else if(k===1){ a=rnd(1,9)*100 + rnd(1,9); b=fd3(); }    // 503×629（十の位が0）
      else if(k===2){ a=rnd(1,9)*100 + rnd(1,9)*10; b=fd3(); } // 970×218（一の位が0）
      else { a=fd3(); b=rnd(1,9)*100 + rnd(1,9); }             // 895×704（乗数に0）
      stF = fMakeState(a, b, 0, 0);
    }
    setFb('','');
  }

  /* 手じゅんを 文で 出す ヒント。いまは 使っていない
     （ヒントは 筆算の 中の 点線の 赤しかくに かえた → buildFude）。
     文の ヒントに もどしたい ときの ために のこしてある  */
  function fHintText(){
    var st=stF, t=[], i=0, hasPP=false;
    for(var r=0;r<st.rows.length;r++){
      var row=st.rows[r];
      if(row.kind!=='pp') continue;
      hasPP=true;
      t.push(FNUM[i++]+' '+st.ra+' × '+row.digit + (row.ghost ? '（0ちゃん '+row.ghost+'つ）' : ''));
    }
    if(hasPP) t.push(FNUM[i++]+' たてに たす');
    else t.push(FNUM[i++]+' '+st.ra+' × '+st.rb);
    if(st.zeros>0) t.push(FNUM[i++]+' 0を '+st.zeros+'こ つける');
    return t.join('　');
  }

  /* ---------- 進行（タップ → アニメーション） ---------- */
  function fApply(a){
    var st=stF;
    if(a.t==='arrow'){ st.arrows.push(a.c); st.last=null; }
    else if(a.t==='carry'){ st.carries.push({ r:a.r, c:a.c, v:a.v }); st.last={ t:'carry', r:a.r, c:a.c }; }
    else if(a.t==='digit'){ st.cells[a.r][a.c]=a.ch; st.last={ t:'digit', r:a.r, c:a.c }; }
    else if(a.t==='ghost'){ st.cells[a.r][a.c]='0'; st.ghosts[a.r+','+a.c]=1; st.last={ t:'digit', r:a.r, c:a.c }; }
    else if(a.t==='tail'){ st.cells[a.r][a.c]='0'; st.last={ t:'digit', r:a.r, c:a.c }; }
    else if(a.t==='col'){ st.hi=a.c; st.last=null; }
    else if(a.t==='line'){ st.sumLine=true; st.last={ t:'line' }; }   // こたえの 線を 引く
  }
  function fStep(){
    var st=stF, ph=st.seq[st.pi];
    fTimer=null;
    if(!ph || st.stage!=='run') return;
    if(st.ai>=ph.acts.length){ fPhaseEnd(); return; }
    var a = ph.acts[st.ai++];
    fApply(a);
    renderFude();
    fTimer = setTimeout(fStep, FSPD[a.t] || 500);
  }
  function fPhaseEnd(){
    var st=stF;
    fStop();
    st.pi++; st.ai=0; st.arrows=[]; st.hi=-1; st.last=null;
    var ph = st.seq[st.pi];
    if(!ph){
      st.done=true; st.stage='done'; renderFude();
      showMaru(); scheduleNext(); return;
    }
    if(ph.kind==='mul'){ st.stage='pick'; renderFude(); return; }
    if(ph.kind==='ghost'){ st.stage='ghost'; renderFude(); return; }
    st.stage='run'; renderFude();
    fTimer = setTimeout(fStep, FSPD.gap);
  }
  // かける数を タップした
  function fPick(mcol){
    var st=stF, ph=st.seq[st.pi];
    if(st.done || st.stage!=='pick' || !ph) return;
    var bd = String(st.rb), rightR = st.cols-1-st.base, i = rightR - mcol;
    var dg = (i>=0 && i<bd.length) ? bd.charAt(bd.length-1-i) : '';
    if(dg===''){ setFb('かける数の 数字を タップしてね','neutral'); return; }
    if(mcol!==ph.mcol){ setFb('✗ 右の 位から じゅんに かけよう','ng'); showBatsu(); return; }
    setFb('',''); hideBatsu();
    st.stage='run'; st.ai=0; renderFude();
    fTimer = setTimeout(fStep, FSPD.gap);
  }
  // ゆうれいの0ちゃんの キーを おした
  function fZero(k){
    var st=stF, ph=st.seq[st.pi];
    if(st.done || st.stage!=='ghost' || !ph) return;
    // 書きおわった あと、つぎへ 進むまでの あいだに もう一度 おされても 何もしない
    if(st.ai>=ph.acts.length) return;
    if(Number(k)!==0){ setFb('✗ 「ゆうれいの 0ちゃん」だから 0 を おそう','ng'); showBatsu(); return; }
    setFb('',''); hideBatsu();
    fApply(ph.acts[st.ai++]);
    renderFude();
    if(st.ai>=ph.acts.length) fTimer = setTimeout(fPhaseEnd, FSPD.gap);
  }
  // 画面を タップ → いまの段を さいごまで
  function fSkip(){
    var st=stF, ph=st.seq[st.pi];
    if(st.stage!=='run' || !ph) return;
    fStop();
    while(st.ai<ph.acts.length) fApply(ph.acts[st.ai++]);
    st.last=null; renderFude();
    fTimer = setTimeout(fPhaseEnd, FSPD.gap);
  }
  // もう一度（同じ問題を はじめから）
  function fAgain(){
    fStop(); cancelAuto(); hideMaru(); hideBatsu(); setFb('','');
    if(fType==='fx'){ fxVals=['','']; fxMarks=['','']; fxSel=0; fxReset(); fRevealed=false; renderFude(); return; }
    stF = fMakeState(stF.ra, stF.rb, stF.pa, stF.qb);
    fRevealed=false; renderFude();
  }
  // さいごまで 見せる
  function fReveal(){
    var st=stF; fStop();
    while(st.pi<st.seq.length){
      var ph=st.seq[st.pi];
      while(st.ai<ph.acts.length) fApply(ph.acts[st.ai++]);
      st.pi++; st.ai=0;
    }
    st.arrows=[]; st.hi=-1; st.last=null; st.done=true; st.stage='done';
    fRevealed=true; renderFude();
  }

  /* ---------- 絵をかく ---------- */
  function buildFude(){
    var st=stF, n=st.cols, PADL=66, PADR=10;
    var VW = PADL + n*FC + PADR;
    var yA = 8, yB = yA + FH, y = yB + FH, body='', r, c;
    var hasPP=false;
    for(r=0;r<st.rows.length;r++) if(st.rows[r].kind==='pp') hasPP=true;

    var rightR = n-1-st.base;
    // × の 列。ここが かけ算の 線の 左はし
    var xcol = rightR - Math.max(String(st.ra).length, String(st.rb).length);
    // ゆうれいの0も 入れた 右はし。ここが かけ算の 線の 右はし
    var mulRight = rightR + Math.max(st.pa, st.qb);

    var lines=[];
    // ① かけ算の 線 … 数字の ある ところ だけ
    lines.push({ y:y+2, kind:'mul',
                 x1:(xcol>=0 ? PADL+xcol*FC : PADL-FC), x2:PADL+(mulRight+1)*FC });
    y += 14;
    var rowY=[];
    for(r=0;r<st.rows.length;r++){
      var kd = st.rows[r].kind;
      if(kd==='sum' && hasPP){
        // ② こたえの 線 … こたえの けた数の ぶんだけ。部分積が そろってから 引く
        var sumLen = String(st.fin).length;
        lines.push({ y:y+2, kind:'sum', x1:PADL+Math.max(0,n-sumLen)*FC, x2:PADL+n*FC });
        y += 14;
      }
      rowY[r] = y; y += FH;
    }
    var VH = y + 8;
    function cx(c){ return PADL + c*FC + FC/2; }

    function digitsAt(str, rightCol, yy, fill, pop){
      var t='';
      for(var i=0;i<str.length;i++){
        var c2 = rightCol - str.length + 1 + i;
        if(c2<0 || c2>=n) continue;
        t += '<text x="'+cx(c2)+'" y="'+(yy+FH*0.74)+'" text-anchor="middle" '+
             'font-size="42" font-weight="800" fill="'+fill+'"'+(pop?' class="fpop"':'')+'>'+str.charAt(i)+'</text>';
      }
      return t;
    }
    // anim＝true の ときは 左から 右へ 引かれて いく
    function hline(ln, anim){
      var L = ln.x2 - ln.x1;
      var sty = anim ? ' style="stroke-dasharray:'+L+';stroke-dashoffset:'+L+
                       ';animation:fdraw .5s ease-out forwards"' : '';
      return '<line x1="'+ln.x1+'" y1="'+ln.y+'" x2="'+ln.x2+'" y2="'+ln.y+
             '" stroke="var(--line)" stroke-width="3" stroke-linecap="round"'+sty+'/>';
    }
    // ななめ線。いまは 使っていない（とった 0を 消さない ことに した）
    function slash(fromCol, toCol, yy){
      var t='';
      for(var c2=fromCol;c2<=toCol;c2++){
        if(c2<0 || c2>=n) continue;
        var x=PADL+c2*FC;
        t += '<line x1="'+(x+9)+'" y1="'+(yy+FH*0.70)+'" x2="'+(x+FC-9)+'" y2="'+(yy+FH*0.22)+
             '" stroke="#c3ccd2" stroke-width="2.5" stroke-linecap="round"/>';
      }
      return t;
    }
    function arrow(x1,y1,x2,y2){
      var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy)||1;
      var ux=dx/L, uy=dy/L, hx=x2-ux*13, hy=y2-uy*13, px=-uy*6.5, py=ux*6.5;
      return '<line x1="'+x1+'" y1="'+y1+'" x2="'+hx+'" y2="'+hy+
             '" stroke="var(--fbl)" stroke-width="3.4" stroke-linecap="round"/>'+
             '<path d="M '+x2+' '+y2+' L '+(hx+px)+' '+(hy+py)+' L '+(hx-px)+' '+(hy-py)+
             ' Z" fill="var(--fbl)"/>';
    }

    // うすい マス目（方眼）
    var gy = [yA, yB];
    for(r=0;r<st.rows.length;r++) gy.push(rowY[r]);
    for(var q=0;q<gy.length;q++){
      for(c=0;c<n;c++){
        body += '<rect x="'+(PADL+c*FC)+'" y="'+gy[q]+'" width="'+FC+'" height="'+FH+
                '" fill="none" stroke="#e4ecf1" stroke-width="1.2"/>';
      }
    }
    // たし算の 列を 光らせる
    if(st.hi>=0){
      var hy0 = rowY[0], hy1 = rowY[st.rows.length-1]+FH;
      body += '<rect x="'+(PADL+st.hi*FC)+'" y="'+(hy0-6)+'" width="'+FC+'" height="'+(hy1-hy0+12)+
              '" rx="6" fill="rgba(58,134,214,.12)"/>';
    }

    // かけられる数
    body += digitsAt(String(st.ra), rightR, yA, 'var(--ink)');
    if(st.pa){
      // とった 0は うすい色。ななめ線では 消さない（先生の 指示）
      body += digitsAt(new Array(st.pa+1).join('0'), rightR+st.pa, yA, '#c3ccd2');
    }
    // ×かける数
    var rbs = String(st.rb);
    body += digitsAt(rbs, rightR, yB, 'var(--ink)');
    if(st.qb){
      body += digitsAt(new Array(st.qb+1).join('0'), rightR+st.qb, yB, '#c3ccd2');
    }
    // × は 筆算ぜんたいの 左どなり（xcol は うえで 計算ずみ）
    var xx = (xcol>=0) ? cx(xcol) : (PADL-FC/2);
    body += '<text x="'+xx+'" y="'+(yB+FH*0.74)+'" text-anchor="middle" font-size="42" font-weight="800" fill="var(--ink)">×</text>';

    // よこ線。こたえの 線は 部分積が そろう まで 出さない
    for(var L2=0;L2<lines.length;L2++){
      var ln = lines[L2];
      if(ln.kind==='sum' && !st.sumLine) continue;
      body += hline(ln, ln.kind==='sum' && st.last && st.last.t==='line');
    }

    // 各段の 数字（ゆうれいの0ちゃんは うすい色）
    for(r=0;r<st.rows.length;r++){
      for(c=0;c<n;c++){
        var ch = st.cells[r][c];
        if(ch==='') continue;
        var isNew = (st.last && st.last.t==='digit' && st.last.r===r && st.last.c===c);
        var gcol = st.ghosts[r+','+c] ? '#a9b4bc' : 'var(--ink)';
        body += '<text x="'+cx(c)+'" y="'+(rowY[r]+FH*0.74)+'" text-anchor="middle" font-size="42" '+
                'font-weight="800" fill="'+gcol+'"'+(isNew?' class="fpop"':'')+'>'+ch+'</text>';
      }
      if(st.rows[r].kind==='sum' && st.zeros>0){
        body += '<text x="6" y="'+(rowY[r]+FH*0.62)+'" text-anchor="start" font-size="16" font-weight="800" fill="#8a97a0">こたえ</text>';
      }
    }
    // 繰り上がりの 小さい数字。前の段の ぶんは うすく
    var curRow = st.seq[st.pi] ? st.seq[st.pi].row : -1;
    for(var m=0;m<st.carries.length;m++){
      var cy2 = st.carries[m];
      var isNewC = (st.last && st.last.t==='carry' && st.last.r===cy2.r && st.last.c===cy2.c);
      body += '<text x="'+(PADL+(cy2.c-1)*FC+FC*0.74)+'" y="'+(rowY[cy2.r]+FH*0.30)+'" text-anchor="middle" '+
              'font-size="19" font-weight="800" fill="'+(cy2.r===curRow?'var(--ink)':'#a9b4bc')+'"'+
              (isNewC?' class="fpop"':'')+'>'+cy2.v+'</text>';
    }
    // 青い矢印（かける数 → かけられる数）
    if(st.arrows.length){
      var ph0 = st.seq[st.pi], mc = ph0 ? ph0.mcol : rightR;
      for(var k2=0;k2<st.arrows.length;k2++){
        body += arrow(cx(mc), yB+FH*0.20, cx(st.arrows[k2]), yA+FH*0.86);
      }
    }
    // ゆうれいの0ちゃんを 書く ところ（点線の まる）
    if(st.stage==='ghost'){
      var phg = st.seq[st.pi], ag = phg.acts[st.ai];
      if(ag){
        body += '<circle cx="'+cx(ag.c)+'" cy="'+(rowY[ag.r]+FH*0.52)+'" r="'+(FC*0.40)+
                '" fill="rgba(242,96,42,.10)" stroke="var(--arrow)" stroke-width="3" stroke-dasharray="6 5"/>';
      }
    }
    /* ヒント（点線の 赤しかく）
       ・かける数を タップする 場面 … つぎに おす 数字を 1つだけ かこむ。
         タップして 計算が はじまると（stage が run に なる）しかくは 消える
       ・くふうしての さいご「とった 0を つける」場面 … 線の 上の
         とった 0 ぜんぶを 大きく ひとまとめに かこむ  */
    if(fHint && !st.done){
      var phh = st.seq[st.pi];
      if(phh && st.stage==='pick' && phh.mcol!==undefined && phh.mcol>=0 && phh.mcol<n){
        body += '<rect x="'+(PADL+phh.mcol*FC+2)+'" y="'+(yB+2)+'" width="'+(FC-4)+'" height="'+(FH-4)+
                '" rx="7" fill="none" stroke="var(--red)" stroke-width="3" stroke-dasharray="7 5" '+
                'pointer-events="none"/>';
      }else if(phh && st.stage==='ghost' && st.zeros>0 &&
               phh.acts[0] && phh.acts[0].t==='tail'){
        var zc0 = rightR+1, zc1 = rightR + Math.max(st.pa, st.qb);
        body += '<rect x="'+(PADL+zc0*FC-5)+'" y="'+(yA-6)+'" width="'+((zc1-zc0+1)*FC+10)+
                '" height="'+(yB+FH-yA+4)+'" rx="10" fill="none" stroke="var(--red)" '+
                'stroke-width="3.5" stroke-dasharray="9 6" pointer-events="none"/>';
      }
    }

    // かける数を えらぶ ところ（タップの あたり判定）
    if(st.stage==='pick'){
      for(var i3=0;i3<rbs.length;i3++){
        var mcol = rightR - i3;
        body += '<rect data-m="'+mcol+'" x="'+(PADL+mcol*FC)+'" y="'+yB+'" width="'+FC+'" height="'+FH+
                '" fill="transparent" style="cursor:pointer"/>';
      }
    }
    var css = '<style>.fpop{animation:fpop .32s ease-out both}'+
              '@keyframes fpop{from{opacity:0}to{opacity:1}}'+
              '@keyframes fdraw{to{stroke-dashoffset:0}}'+
              '@media(prefers-reduced-motion:reduce){.fpop{animation:none}line{animation:none!important;stroke-dashoffset:0!important}}</style>';
    return '<svg viewBox="0 0 '+VW+' '+VH+'" xmlns="http://www.w3.org/2000/svg" '+
           'style="width:100%;height:auto;max-height:calc(var(--fmax) - var(--fgap))">'+css+body+'</svg>';
  }

  function renderFude(){
    var isFx = (fType==='fx');
    document.getElementById('fudeMain').style.display = isFx ? 'none' : '';
    document.getElementById('fxArea').style.display   = isFx ? '' : 'none';
    document.getElementById('answerBox').style.display = isFx ? '' : 'none';
    ans.style.display = 'none';
    document.getElementById('unitPad').style.display = 'none';
    document.getElementById('fAgainBtn').style.display = '';
    Array.prototype.forEach.call(document.querySelectorAll('#fops button'), function(b){
      var v = b.getAttribute('data-fq');
      b.classList.toggle('on', fRand ? (v==='rand') : (v===fType));
    });
    document.getElementById('fHintBtn').classList.toggle('on', fHint);
    if(isFx){
      document.getElementById('fzero').style.visibility = 'hidden';
      renderFx();
      // ヒントは 筆算の 中の 点線（buildFxGrid）で 出すので 文は 出さない
      document.getElementById('fnote').innerHTML = '';
      document.getElementById('freveal').textContent = fRevealed ? ('こたえ：'+fxTargets().join('、')) : '';
      return;
    }
    var st = stF, ph = st.seq[st.pi];
    var msg = st.done ? ('こたえ （ '+st.fin+' ）')
            : (!ph ? '' : ((st.stage==='pick' || st.stage==='ghost') ? ph.pick : ph.msg));
    document.getElementById('fq').innerHTML = st.done
      ? '<span style="color:var(--ok)">'+msg+'</span>' : msg;

    // 出ていない ときも 場所は あけたまま（筆算が 横に ずれない）
    document.getElementById('fzero').style.visibility = (st.stage==='ghost') ? 'visible' : 'hidden';

    var g = document.getElementById('fgrid');
    g.innerHTML = buildFude();
    g.onclick = function(e){
      var t = e.target;
      var m = (t && t.getAttribute) ? t.getAttribute('data-m') : null;
      if(m!==null && m!==undefined){ fPick(Number(m)); return; }
      if(st.stage==='run') fSkip();
    };

    // ヒントは 筆算の 中の「点線の 赤しかく」（buildFude）で 出すので、
    // ここに 文は 出さない（文を 出すと 筆算の 高さが かわってしまう）
    document.getElementById('fnote').innerHTML = '';
    document.getElementById('freveal').textContent = '';
  }

  /* =========================================================
     ⑦ 数をつくる（0〜9の数字で □けたの整数 ／ 大小くらべ）
     ========================================================= */
  var bType='b1', bRand=false, bHint=false, bRevealed=false;
  var bN=9, bKind='max', bRank=1, bAns=0;                 // 大きい整数
  var bPre='', bSuf='', bBot='', bDig=0, bSet=[], bSel=[], bTry=null; // 大小くらべ
  var stB = ciMake(9);
  stB.home = 0;               // いちばん 大きい位から 書きはじめる

  // 1けたずつ 同じ幅の マスに 入れる（位が たてに そろう）
  function spread(s, cls){
    var t='', a=String(s);
    for(var i=0;i<a.length;i++) t += '<span class="bcell'+(cls||'')+'">'+a.charAt(i)+'</span>';
    return t;
  }

  function newBig(){
    CH.newProblem();
    bHint=false; bRevealed=false;
    if(bType==='b1'){
      bN   = pick([8,9,10]);
      bKind= 'max';                          // 「小さい」は 出さない
      bRank= (rnd(0,4)===0) ? 1 : rnd(2,10);  // 2〜10ばんめが 中心
      bAns = (bKind==='max') ? (pow10(bN) - bRank) : (pow10(bN-1) + bRank - 1);
      ciReset(stB, bN);
    }else{
      var guard=0, n=9;
      do{
        guard++;
        var d=[ rnd(1,9) ];
        for(var i=1;i<n;i++) d.push(rnd(0,9));
        var pos = rnd(2, n-4);                 // □の 場所（うしろに 3けた以上 のこす）
        d[pos]   = rnd(6,8);                 // ㋑の □と 同じ位は 6・7・8
        d[pos+1] = rnd(1,9);                 // その 右は 1以上（㋐を もっと 小さく できるように）
        var suf = [];
        for(var j=pos+1;j<n;j++) suf.push(rnd(0,9));
        suf[0] = rnd(0, d[pos+1]-1);         // □の すぐ右は ㋐の ほうが 小さい
        bPre = d.slice(0,pos).join('');
        bSuf = suf.join('');
        bBot = d.join('');
        bDig = d[pos];
        var sufBot = d.slice(pos+1).join('');
        bSet = [];
        for(var v=0;v<=9;v++){
          if(v > bDig) bSet.push(v);
          else if(v === bDig && Number(bSuf) > Number(sufBot)) bSet.push(v);
        }
      }while(guard<80 && (bSet.length<1 || bSet.length>9));
      bSel = []; bTry = null;
    }
    setFb('','');
  }

  function bAnsText(){
    return (bType==='b1') ? String(bAns) : bSet.join('、');
  }

  function renderBig(){
    var q  = document.getElementById('bq'),  q2 = document.getElementById('bq2');
    var g  = document.getElementById('bgrid'), ch = document.getElementById('bchoices');

    if(bType==='b1'){
      q.innerHTML = '0から9までの 数字を 使って、<b>'+bN+'けた</b>の 整数を つくります。<br>'+
                    '同じ数字を 何回 使っても よいとき、つぎの 整数を 書きましょう。';
      q2.className = 'qbig';
      q2.textContent = (bRank===1 ? 'いちばん ' : bRank+'ばんめに ') +
                       (bKind==='max' ? '大きい' : '小さい') + ' 整数';
      g.style.display=''; ch.style.display='none';
      ciGrid('bgrid', stB, bHint, renderBig);
      document.getElementById('numPad').style.display='';
      document.getElementById('bZeroBtn').style.display='';
    }else{
      q.innerHTML = '㋐と㋑は どちらも 9けたの 整数です。<br>'+
                    '㋐が ㋑より 大きく なるのは、□が どんな 数字の ときですか。<b>ぜんぶ</b> えらびましょう。';
      // ヒントの ときは、㋐㋑で 同じ 上の位を うっすら かくす
      var dim = bHint ? ' bdim' : '', np = bPre.length;
      q2.className = 'qbig cmp';        // 上の 問題文と 下の えらび肢から はなす
      q2.innerHTML = '<span class="bline"><span class="blbl">㋐</span>'+spread(bPre, dim)+
                     '<span class="bcell bbox">'+(bTry===null ? '&nbsp;' : bTry)+'</span>'+spread(bSuf)+'</span>'+
                     '<span class="bline"><span class="blbl">㋑</span>'+
                     spread(bBot.slice(0,np), dim)+spread(bBot.slice(np))+'</span>';
      g.innerHTML=''; g.onclick=null; g.style.display='none';
      ch.style.display='';
      var html='';
      for(var v=0;v<=9;v++){
        html += '<button class="'+((bSel.indexOf(v)>=0)?'on':'')+'" data-v="'+v+'">'+v+'</button>';
      }
      ch.innerHTML = html;
      Array.prototype.forEach.call(ch.querySelectorAll('button'), function(b){
        b.addEventListener('click', function(){
          cancelAuto(); hideMaru(); hideBatsu();
          var v = Number(b.getAttribute('data-v'));
          bTry = v;                       // 赤い しかくに 入れて くらべやすく
          var i = bSel.indexOf(v);
          if(i>=0) bSel.splice(i,1); else bSel.push(v);
          bRevealed=false; setFb('','');
          renderBig();
        });
      });
      document.getElementById('numPad').style.display='none';
      document.getElementById('bZeroBtn').style.display='none';
    }
    document.getElementById('breveal').textContent = bRevealed ? ('こたえ：'+bAnsText()) : '';
    document.getElementById('bHintBtn').classList.toggle('on', bHint);
    document.getElementById('bHintBtn').textContent = (bType==='b1') ? 'ヒント（9を入れる）' : 'ヒント（同じ位を かくす）';
    ans.style.display='none';
    document.getElementById('unitPad').style.display='none';
    Array.prototype.forEach.call(document.querySelectorAll('#bops button'), function(b){
      var v=b.getAttribute('data-bq');
      b.classList.toggle('on', bRand ? (v==='rand') : (v===bType));
    });
  }

  function bCheck(){
    if(bType==='b1'){ ciCheck(stB, bAns, false, renderBig); return; }
    if(bSel.length===0){ setFb('えらんでね','neutral'); return; }
    var a=bSel.slice().sort(function(x,y){return x-y;}).join(','),
        b=bSet.slice().sort(function(x,y){return x-y;}).join(',');
    if(a===b){ setFb('◯ せいかい！','ok'); showMaru(); scheduleNext(); }
    else{ setFb('✗ もういちど（ぜんぶ そろえよう）','ng'); showBatsu(); }
  }

  /* =========================================================
     ⑧ まちがいさがし（筆算タブの中の 1つ）
       293×605 の ように、百の位の 部分積を 1けたしか ずらしていない 筆算
       ①に 600、②に 2 が 入ると、部分積を 正しい位置へ 動かし、
       まちがった 積を 消して、一の位から じゅんに たし算を 見せる。
       たし算は 子どもが 書かない（見て たしかめる）
     ========================================================= */
  var fxA=293, fxH=6, fxO=5, fxVals=['',''], fxSel=0, fxMarks=['',''];
  /* fxMoved … ①（□×700）が 合った。3402を 正しい 位置へ 動かした
     fxFixed … ①②が そろった。たし算を はじめる（もう 書きかえられない） */
  var fxMoved=false, fxFixed=false, fxCells=[], fxCarries=[], fxHi=-1, fxLast=null;
  var fxActs=[], fxAi=0, fxDone=false, fxTimer=null;

  function fxB(){ return fxH*100 + fxO; }
  function fxPP1(){ return fxA*fxO; }
  function fxPP2(){ return fxA*fxH; }
  function fxWrong(){ return fxPP1() + fxPP2()*10; }
  function fxProd(){ return fxA*fxB(); }
  function fxCols(){ return String(fxWrong()).length + 1; }
  function fxTargets(){ return [ fxH*100, 2 ]; }
  function fxStop(){ if(fxTimer){ clearTimeout(fxTimer); fxTimer=null; } }

  function newFx(){
    fxStop();
    CH.newProblem();
    fxA = rnd(1,9)*100 + rnd(0,9)*10 + rnd(1,9);
    fxH = rnd(2,9); fxO = rnd(2,9);
    fxVals=['','']; fxSel=0; fxMarks=['',''];
    fxReset();
    fHint=false; fRevealed=false;
    setFb('','');
  }
  function fxReset(){
    fxStop();
    fxMoved=false; fxFixed=false; fxCells=[]; fxCarries=[]; fxHi=-1; fxLast=null;
    fxActs=[]; fxAi=0; fxDone=false;
    for(var c=0;c<fxCols();c++) fxCells.push('');
  }

  // 段を 列ごとの 数字に ばらす
  function fxSpreadRow(val, rightCol){
    var n=fxCols(), s=String(val), a=[], c;
    for(c=0;c<n;c++) a.push('');
    for(var i=0;i<s.length;i++){
      var c2 = rightCol - s.length + 1 + i;
      if(c2>=0 && c2<n) a[c2]=s.charAt(i);
    }
    return a;
  }

  // たし算の 手じゅん（一の位から）
  function fxAddActs(){
    var n=fxCols(), e1=fxSpreadRow(fxPP1(), n-1), e2=fxSpreadRow(fxPP2(), n-3);
    var s=String(fxProd()), left=n-s.length, acts=[], carry=0, c;
    for(c=n-1;c>=left;c--){
      acts.push({ t:'col', c:c });
      var v = carry + (e1[c]===''?0:Number(e1[c])) + (e2[c]===''?0:Number(e2[c]));
      var ch = v%10; carry = Math.floor(v/10);
      if(carry>0) acts.push({ t:'carry', c:c, v:carry });
      acts.push({ t:'digit', c:c, ch:String(ch) });
    }
    return acts;
  }
  function fxApply(a){
    if(a.t==='col'){ fxHi=a.c; fxLast=null; }
    else if(a.t==='carry'){ fxCarries.push({ c:a.c, v:a.v }); fxLast={ t:'carry', c:a.c }; }
    else if(a.t==='digit'){ fxCells[a.c]=a.ch; fxLast={ t:'digit', c:a.c }; }
  }
  function fxStep(){
    fxTimer=null;
    if(fxAi>=fxActs.length){
      fxHi=-1; fxLast=null; fxDone=true; renderFx();
      setFb('◯ せいかい！','ok'); showMaru(); scheduleNext(); return;
    }
    var a=fxActs[fxAi++];
    fxApply(a); renderFx();
    fxTimer = setTimeout(fxStep, FSPD[a.t] || 500);
  }
  /* ①が 合ったら 3402を 正しい 位置へ 動かす。
     ②も そろったら まちがった こたえを 消して たし算を はじめる  */
  function fxTryFix(){
    var was = fxFixed;
    var moved = (fxVals[0]!=='' && Number(fxVals[0])===fxH*100);
    var ok = moved && (fxVals[1]!=='' && Number(fxVals[1])===2);
    if(ok && !was){
      fxReset(); fxMoved=true; fxFixed=true;
      fxActs = fxAddActs(); fxAi=0;
      setFb('これで 正しい 筆算だね。たし算を 見よう','ok');
      fxTimer = setTimeout(fxStep, FSPD.gap);
      return;
    }
    if(!ok && was) fxReset();            // ①②を なおしたら もとの まちがった 筆算へ
    if(moved && !fxMoved) setFb(fxPP2()+' を 正しい 位置に 動かしたよ','ok');
    fxMoved = moved;                     // ①だけでも 合っていれば 動かした ままに
  }
  // ①が 合ったら ②の □へ
  function fxAdvance(){
    if(fxSel===0 && fxVals[0]!=='' && Number(fxVals[0])===fxH*100 && fxVals[1]===''){
      fxSel = 1;
    }
  }

  function buildFxGrid(){
    var n = fxCols();
    var PADL=44, PADR=10, C=44, H=48, y=6, body='';
    function dig(str, rightCol, yy, fill){
      var t='';
      for(var i=0;i<str.length;i++){
        var c = rightCol - str.length + 1 + i;
        if(c<0 || c>=n) continue;
        t += '<text x="'+(PADL+c*C+C/2)+'" y="'+(yy+H*0.76)+'" text-anchor="middle" '+
             'font-size="36" font-weight="800" fill="'+fill+'">'+str.charAt(i)+'</text>';
      }
      return t;
    }
    // 線は 数字の ある ところ だけ。x1/x2 は 列で わたす
    function hl(yy, c1, c2){
      return '<line x1="'+(PADL+Math.max(0,c1)*C)+'" y1="'+yy+'" x2="'+(PADL+c2*C)+'" y2="'+yy+
             '" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>';
    }
    var yPP1, yPP2, ySum;
    body += dig(String(fxA), n-1, y, 'var(--ink)'); y+=H;
    var bs=String(fxB()), yMul=y;                     // yMul＝かける数の 段
    body += dig(bs, n-1, y, 'var(--ink)');
    var fxXcol = n-1-bs.length;                       // × の 列
    body += '<text x="'+(PADL+fxXcol*C+C/2)+'" y="'+(y+H*0.76)+
            '" text-anchor="middle" font-size="36" font-weight="800" fill="var(--ink)">×</text>';
    y+=H; body += hl(y+2, fxXcol, n); y+=12;
    yPP1 = y; body += dig(String(fxPP1()), n-1, y, 'var(--ink)'); y+=H;
    yPP2 = y;
    if(fxMoved){
      body += dig(String(fxPP2()), n-3, y, 'var(--ok)');     // 正しい 位置へ 動かした
    }else{
      body += dig(String(fxPP2()), n-2, y, 'var(--red)');    // ここが まちがい
      body += '<text x="'+(PADL+n*C+4)+'" y="'+(y+H*0.7)+'" font-size="20" font-weight="800" fill="var(--red)">←</text>';
    }
    // こたえの 線は 正しい 答えの けた数に あわせる
    y+=H; body += hl(y+2, n-String(fxProd()).length, n); y+=12;
    ySum = y;
    if(fxFixed){
      for(var c=0;c<n;c++){
        if(fxCells[c]==='') continue;
        var isNew = (fxLast && fxLast.t==='digit' && fxLast.c===c);
        body += '<text x="'+(PADL+c*C+C/2)+'" y="'+(y+H*0.76)+'" text-anchor="middle" font-size="36" '+
                'font-weight="800" fill="var(--ink)"'+(isNew?' class="fpop"':'')+'>'+fxCells[c]+'</text>';
      }
      for(var m=0;m<fxCarries.length;m++){
        var cy=fxCarries[m];
        var isNewC = (fxLast && fxLast.t==='carry' && fxLast.c===cy.c);
        body += '<text x="'+(PADL+(cy.c-1)*C+C*0.74)+'" y="'+(y+H*0.30)+'" text-anchor="middle" '+
                'font-size="17" font-weight="800" fill="var(--ink)"'+(isNewC?' class="fpop"':'')+'>'+cy.v+'</text>';
      }
    }else if(!fxMoved){
      body += dig(String(fxWrong()), n-1, y, 'var(--red)');   // まだ 直して いない ときだけ
    }
    // 動かした あとは まちがった こたえを 消して、②が 入るのを 待つ
    y+=H;
    /* ヒント
       ・①の あいだ … かける数の 百の位（7）を 点線の 赤しかくで かこむ
       ・3402を 動かした あと（②のあいだ）… 3402の 右に うすい 0を 2つ 出す  */
    if(fHint && !fxDone){
      if(!fxMoved){
        body += '<rect x="'+(PADL+(n-3)*C+2)+'" y="'+(yMul+2)+'" width="'+(C-4)+'" height="'+(H-4)+
                '" rx="7" fill="none" stroke="var(--red)" stroke-width="3" stroke-dasharray="7 5" '+
                'pointer-events="none"/>';
      }else if(!fxFixed){
        // 「3けた×3けた」の ゆうれいの 0ちゃんと 同じ、色を かえた うすい 0
        for(var z=n-2;z<=n-1;z++){
          body += '<text x="'+(PADL+z*C+C/2)+'" y="'+(yPP2+H*0.76)+'" text-anchor="middle" '+
                  'font-size="36" font-weight="800" fill="#a9b4bc" pointer-events="none">0</text>';
        }
      }
    }
    // たし算中の 列を 光らせる
    var hiRect='';
    if(fxHi>=0){
      hiRect = '<rect x="'+(PADL+fxHi*C)+'" y="'+(yPP1-4)+'" width="'+C+'" height="'+(ySum+H-yPP1+8)+
               '" rx="6" fill="rgba(58,134,214,.12)"/>';
    }
    var css = '<style>.fpop{animation:fpop .32s ease-out both}'+
              '@keyframes fpop{from{opacity:0}to{opacity:1}}'+
              '@media(prefers-reduced-motion:reduce){.fpop{animation:none}}</style>';
    return '<svg viewBox="0 0 '+(PADL+n*C+PADR+26)+' '+(y+8)+'" xmlns="http://www.w3.org/2000/svg" '+
           'style="width:100%;height:auto;max-height:26vh">'+css+hiRect+body+'</svg>';
  }

  function fxBoxHtml(i){
    return '<span class="fxbox '+(fxMarks[i]||'')+(fxSel===i?' sel':'')+'" data-b="'+i+'">'+
           (fxVals[i]==='' ? '&nbsp;' : fxVals[i])+'</span>';
  }
  function renderFx(){
    document.getElementById('fxgrid').innerHTML = buildFxGrid();
    var sent = document.getElementById('fxsent');
    sent.innerHTML =
      '① '+fxPP2()+' を 左へ 2けた ずらして 書かなければ いけません。<br>'+
      'なぜなら、'+fxPP2()+' は、'+fxA+' × '+fxBoxHtml(0)+' の 答えの '+(fxPP2()*100)+' の<br>'+
      '0を '+fxBoxHtml(1)+' つ 省いた 数だからです。';
    var q2 = document.getElementById('fxq2');
    q2.innerHTML = '';                      // ②の 説明は 出さない（筆算に 積が 出る）
    sent.onclick = function(e){
      var t=e.target;
      if(!t || !t.getAttribute) return;
      var i=t.getAttribute('data-b');
      if(i===null) return;
      cancelAuto(); hideMaru(); hideBatsu();
      fxSel=Number(i); setFb('',''); renderFx();
    };
    q2.onclick = null;
  }

  function fxKey(k){
    if(fxDone) return;
    if(k==='clear'){ fxVals=['','']; fxMarks=['','']; fxSel=0; setFb('',''); fxTryFix(); renderFx(); return; }
    if(k==='back'){ fxVals[fxSel]=fxVals[fxSel].slice(0,-1); fxMarks[fxSel]=''; fxTryFix(); renderFx(); return; }
    if(fxFixed) return;
    if(fxVals[fxSel].length>=8) return;
    fxVals[fxSel] += String(k);
    fxMarks[fxSel]='';
    setFb('','');
    fxAdvance();            // ①が 合ったら ②の □へ
    fxTryFix();             // ①②が そろったら たし算を はじめる
    renderFx();
  }

  function fxCheck(){
    if(fxFixed) return;
    var tg=fxTargets(), all=true, any=false;
    for(var i=0;i<2;i++){
      if(fxVals[i]!=='') any=true;
      var ok = (fxVals[i]!=='' && Number(fxVals[i])===tg[i]);
      fxMarks[i] = ok ? 'ok' : 'ng';
      if(!ok) all=false;
    }
    if(!any){ fxMarks=['','']; setFb('□に 数を 書いてね','neutral'); renderFx(); return; }
    if(!all){ setFb('✗ 赤い □を 見なおそう','ng'); renderFx(); showBatsu(); }
  }

  function fxReveal(){
    var tg=fxTargets();
    fxVals=[String(tg[0]), String(tg[1])];
    fxMarks=['','']; fRevealed=true;
    fxReset(); fxMoved=true; fxFixed=true;
    var acts=fxAddActs();
    for(var i=0;i<acts.length;i++) fxApply(acts[i]);
    fxHi=-1; fxLast=null; fxDone=true;
    renderFx();
  }
  // 文の ヒント。いまは 使っていない（ヒントは 筆算の 中の 点線に かえた）
  function fxHintText(){
    return fxH+' は 百の位の 数字だから、ほんとうは '+fxA+' × '+(fxH*100)+' を 計算している。';
  }

  /* =========================================================
     こたえ入力・テンキー
     ========================================================= */
  var mode = 'shikumi';
  function unitKeysOn(){ return (mode==='nl') || (mode==='mul') || (mode==='make' && mUnit); }

  function sanitize(){
    var v = ans.value.replace(/[^0-9兆億万]/g,'');
    if(!unitKeysOn()) v = v.replace(/[兆億万]/g,'');
    ans.value = v;
  }
  ans.addEventListener('input', function(){
    cancelAuto(); hideMaru(); hideBatsu(); sanitize(); xTypedCls='';
    if(mode==='make') renderMake();
    if(mode==='mul') renderMul();
  });

  function press(k){
    if(mode==='flash') return;              // ４けた練習に こたえ欄は ない
    cancelAuto(); hideMaru(); hideBatsu();
    if(mode==='fude'){ if(fType==='fx') fxKey(k); return; }
    if(mode==='big'){ if(bType==='b1') ciKey(stB, bAns, k, renderBig); return; }
    if(mode==='shikumi'){
      if(sType==='w') ciKey(stW, wVal, k, renderWrite);
      return;
    }
    if(mode==='make' && !mIsCount){ ciKey(stM, mAnswer, k, renderMake); return; }
    if(k==='clear'){ ans.value=''; setFb('',''); }
    else if(k==='back'){ ans.value = ans.value.slice(0,-1); }
    else { ans.value += k; }
    xTypedCls='';
    if(mode==='make') renderMake();
    if(mode==='mul') renderMul();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.pad button[data-k], .pad3 button[data-k]'), function(btn){
    btn.addEventListener('click', function(){ press(btn.getAttribute('data-k')); this.blur(); });
  });

  function check(){
    if(mode==='flash') return;              // ４けた練習に こたえあわせは ない
    if(mode==='shikumi' && sType!=='w') return;
    if(mode==='fude'){ if(fType==='fx') fxCheck(); return; }
    if(mode==='big'){ bCheck(); return; }
    if(mode==='shikumi'){ ciCheck(stW, wVal, false, renderWrite); return; }
    if(mode==='make' && !mIsCount){ ciCheck(stM, mAnswer, false, renderMake); return; }
    var raw = ans.value.trim();
    if(raw===''){ setFb('すうじを いれてね','neutral'); return; }

    if(mode==='make'){
      if(mUnit){
        var mv = parseBig(raw);
        if(mv===null){ setFb('すうじを いれてね','neutral'); return; }
        if(mv === mAnswer){ setFb('◯ せいかい！','ok'); showMaru(); scheduleNext(); }
        else{ setFb('✗ もういちど','ng'); showBatsu(); }
        return;
      }
      if(!/^[0-9]+$/.test(raw)){ setFb('すうじを いれてね','neutral'); return; }
      if(Number(raw) === mAnswer){ setFb('◯ せいかい！','ok'); showMaru(); scheduleNext(); }
      else{ setFb('✗ もういちど','ng'); showBatsu(); }
      return;
    }
    var v = parseBig(raw);
    if(v===null){ setFb('すうじを いれてね','neutral'); return; }
    var target = (mode==='nl') ? nlValue(nlArrow) : xAnswer();
    var ok = (v === target);
    if(ok){ setFb('◯ せいかい！','ok'); showMaru(); scheduleNext(); }
    else{ setFb('✗ もういちど','ng'); showBatsu(); }
    if(mode==='mul'){ xTypedCls = ok ? 'ok' : 'ng'; renderMul(); }
  }
  document.getElementById('checkBtn').addEventListener('click', check);
  /* キーボードでも 数字を 入れられる（先生が 教室の パソコンで 使うとき用）
       0〜9      … テンキーと 同じ
       BackSpace … 1つ けす
       Delete/Esc … ぜんぶ けす
       Enter     … こたえあわせ
     ・入力わくを クリックして 直接 打っている ときは じゃまを しない
     ・見せる筆算で「ゆうれいの 0ちゃん」を 書く 場面では、その キーとして はたらく  */
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var el = document.activeElement;

    /* ４けた練習は キーが ちがう。スペース＝つぎの数／H＝かくす・見せる。
       ボタンや チェックボックスに フォーカスが ある ときは ふつうの 動きに ゆずる */
    if(mode==='flash'){
      if(el && (el.tagName==='INPUT' || el.tagName==='BUTTON')) return;
      if(e.key===' ' || e.key==='Enter'){ e.preventDefault(); flNew(); }
      else if(e.key==='h' || e.key==='H'){ e.preventDefault(); flToggleHide(); }
      return;
    }

    if(e.key==='Enter'){
      if(mode==='shikumi' && sType!=='w') return;
      if(el && el.tagName==='BUTTON') return;
      e.preventDefault();
      check();
      return;
    }
    if(el === ans) return;               // 入力わくに 直接 打っている
    if(el && el.tagName==='INPUT') return;

    var k = null;
    if(e.key>='0' && e.key<='9') k = e.key;
    else if(e.key==='Backspace') k = 'back';
    else if(e.key==='Delete' || e.key==='Escape') k = 'clear';
    else return;
    e.preventDefault();

    if(mode==='fude' && fType!=='fx'){
      if(stF && stF.stage==='ghost' && k!=='back' && k!=='clear'){ cancelAuto(); fZero(Number(k)); }
      return;
    }
    press(k);
  });
  document.getElementById('revealBtn').addEventListener('click', function(){
    if(mode==='shikumi'){
      if(sType!=='w') return;
      ciSetValue(stW, wVal);
      wRevealed = !wRevealed; renderWrite();
    }
    else if(mode==='make'){
      if(!mIsCount) ciSetValue(stM, mAnswer);
      mRevealed = !mRevealed; renderMake();
    }
    else if(mode==='nl'){ nlRevealed = !nlRevealed; renderNL(); }
    else if(mode==='mul'){ xRevealed = !xRevealed; renderMul(); }
    else if(mode==='fude'){ if(fType==='fx') fxReveal(); else fReveal(); }
    else if(mode==='big'){
      if(bType==='b1') ciSetValue(stB, bAns);
      bRevealed = !bRevealed; renderBig();
    }
  });

  /* =========================================================
     ボタンの動き
     ========================================================= */
  // ①②⑨ 大きい数のしくみ（何の位／何が何こ／読み方／数字で書く）
  var S_TYPES = ['q1','q3','r','w'];
  var S_SUB = {
    q1:'位取り表を 見て、位（くらい）を こたえよう。',
    q3:'▼の 数字は 何が 何こ ある ことを 表すかな？',
    r :'数字を 見て、読み方を えらぼう。',
    w :'漢字の 数を 数字で 書こう。0の 数に 気をつけて。'
  };

  // いまの sType の 問題を 1つ 作る
  function newShikumi(){
    if(sType==='w'){ newWrite(); wRevealed=false; }
    else if(sType==='r'){ newRead(); }
    else { newKurai(); }
  }

  // タブの 中身（エリア・ボタン・こたえ欄）を sType に あわせる
  function renderShikumi(){
    var isW = (sType==='w'), isR = (sType==='r'), isK = (!isW && !isR);
    document.getElementById('kuraiArea').style.display = isK ? '' : 'none';
    document.getElementById('readArea').style.display  = isR ? '' : 'none';
    document.getElementById('writeArea').style.display = isW ? '' : 'none';
    document.getElementById('sub').textContent = S_SUB[sType];

    Array.prototype.forEach.call(document.querySelectorAll('#sops button'), function(x){
      var v = x.getAttribute('data-sq');
      x.classList.toggle('on', sRand ? (v==='rand') : (v===sType));
    });

    // ボタン列：0を入れる は「数字で書く」だけ。
    //           むずかしい（兆）は「数字で書く」と「読み方」（同じ 数を 使う）
    document.getElementById('wZeroBtn').style.display = isW ? '' : 'none';
    document.getElementById('wHardBtn').style.display = (isW || isR) ? '' : 'none';
    document.getElementById('kRevealBtn').style.display = isW ? 'none' : '';

    // こたえ欄（テンキー）は「数字で書く」のときだけ
    document.getElementById('answerBox').style.display = isW ? '' : 'none';

    if(isW) renderWrite(); else if(isR) renderRead(); else renderKurai();
  }

  function nextShikumi(){
    if(sRand) sType = pick(S_TYPES);
    newShikumi(); clearAll(); renderShikumi();
  }

  Array.prototype.forEach.call(document.querySelectorAll('#sops button'), function(b){
    b.addEventListener('click', function(){
      var q = b.getAttribute('data-sq');
      if(q==='rand'){ sRand=true; sType=pick(S_TYPES); }
      else{ sRand=false; sType=q; }
      cancelAuto(); CH.reset();
      newShikumi(); clearAll(); renderShikumi();
    });
  });
  document.getElementById('sHintBtn').addEventListener('click', function(){
    if(sType==='w') wHint=!wHint;
    else if(sType==='r') rHint=!rHint;
    else kHint=!kHint;
    renderShikumi();
  });
  document.getElementById('sNextBtn').addEventListener('click', function(){ cancelAuto(); nextShikumi(); });
  document.getElementById('kRevealBtn').addEventListener('click', function(){
    if(sType==='r'){ rRevealed=!rRevealed; renderRead(); }
    else { kRevealed=!kRevealed; renderKurai(); }
  });
  document.getElementById('wZeroBtn').addEventListener('click', function(){ ciFillZeros(stW, wVal, renderWrite); });
  document.getElementById('wHardBtn').addEventListener('click', function(){
    wHard = !wHard;
    document.getElementById('wHardBtn').textContent = wHard ? 'かんたん（億）' : 'むずかしい（兆）';
    cancelAuto(); CH.reset();
    newShikumi(); clearAll(); renderShikumi();
  });

  // ③ あわせた数
  Array.prototype.forEach.call(document.querySelectorAll('#mops button'), function(b){
    b.addEventListener('click', function(){
      var q=b.getAttribute('data-mq');
      if(q==='rand'){ mRand=true; mType=pick(['m1','m2','m3','m4']); }
      else{ mRand=false; mType=q; }
      Array.prototype.forEach.call(document.querySelectorAll('#mops button'), function(x){
        var v=x.getAttribute('data-mq');
        x.classList.toggle('on', mRand ? (v==='rand') : (v===mType));
      });
      CH.reset();
      newMake(); clearAll(); renderMake();
    });
  });
  document.getElementById('mHintBtn').addEventListener('click', function(){ mHint=!mHint; renderMake(); });
  document.getElementById('mZeroBtn').addEventListener('click', function(){ ciFillZeros(stM, mAnswer, renderMake); });
  function nextMake(){
    if(mRand) mType = pick(['m1','m2','m3','m4']);
    newMake(); clearAll(); renderMake();
  }
  document.getElementById('mNextBtn').addEventListener('click', function(){ cancelAuto(); nextMake(); });

  // ④ 数直線
  document.getElementById('nHintBtn').addEventListener('click', function(){ nlHint=!nlHint; renderNL(); });
  function nextNL(){ if(rnd(0,3)===0) newNL(); else newNLArrow(); clearAll(); renderNL(); }
  document.getElementById('nRandBtn').addEventListener('click', function(){ cancelAuto(); newNLArrow(); clearAll(); renderNL(); });
  document.getElementById('nRegenBtn').addEventListener('click', function(){ cancelAuto(); CH.reset(); newNL(); clearAll(); renderNL(); });

  // ⑤ 10倍・1/10
  Array.prototype.forEach.call(document.querySelectorAll('#xops button'), function(b){
    b.addEventListener('click', function(){
      var op=b.getAttribute('data-op');
      if(op==='rand'){ xRand=true; xOp=pick(['x10','d10']); }
      else{ xRand=false; xOp=op; }
      CH.reset();
      newMul(xOp); clearAll(); renderMul();
    });
  });
  document.getElementById('xHintBtn').addEventListener('click', function(){ xHint=!xHint; renderMul(); });
  function nextMul(){

    newMul(xOp); clearAll(); renderMul();
  }
  document.getElementById('xNextBtn').addEventListener('click', function(){ cancelAuto(); nextMul(); });

  // ⑦ 数をつくる
  Array.prototype.forEach.call(document.querySelectorAll('#bops button'), function(b){
    b.addEventListener('click', function(){
      var q = b.getAttribute('data-bq');
      if(q==='rand'){ bRand=true; bType=pick(['b1','b2']); }
      else{ bRand=false; bType=q; }
      cancelAuto(); CH.reset(); newBig(); clearAll(); renderBig();
    });
  });
  document.getElementById('bHintBtn').addEventListener('click', function(){
    bHint=!bHint;
    // 「大きい整数」は いちばん 大きい 数から かぞえるので、一の位いがいは ぜんぶ 9。
    // ヒントでは そこまで 入れて、一の位 だけを 子どもが 入れる
    if(bHint && bType==='b1' && !stB.done){
      cancelAuto(); setFb('','');
      for(var i=0;i<stB.n-1;i++) stB.cells[i]='9';
      stB.sel = stB.n-1;
    }
    renderBig();
  });
  document.getElementById('bZeroBtn').addEventListener('click', function(){ ciFillZeros(stB, bAns, renderBig); });
  function nextBig(){

    newBig(); clearAll(); renderBig();
  }
  document.getElementById('bNextBtn').addEventListener('click', function(){ cancelAuto(); nextBig(); });

  // ⑥ かけ算の筆算
  Array.prototype.forEach.call(document.querySelectorAll('#fops button'), function(b){
    b.addEventListener('click', function(){
      var q = b.getAttribute('data-fq');
      if(q==='rand'){ fRand=true; fType=pick(['f3','fk']); }
      else{ fRand=false; fType=q; }
      cancelAuto(); CH.reset(); newFude(fType); clearAll(); renderFude();
    });

  document.getElementById('fHintBtn').addEventListener('click', function(){ fHint=!fHint; renderFude(); });
  function nextFude(){
    if(fRand) fType = pick(['f3','fk']);
    newFude(fType); clearAll(); renderFude();
  }
  document.getElementById('fAgainBtn').addEventListener('click', function(){ fAgain(); });
  document.getElementById('fzero').addEventListener('click', function(e){

    var z=t.getAttribute('data-z');
    if(z===null) return;
    cancelAuto(); fZero(Number(z));
  });
  document.getElementById('fNextBtn').addEventListener('click', function(){ cancelAuto(); nextFude(); });

  /* =========================================================
     ⑩ ４けた練習（フラッシュカード）
     ─────────────────────────────────────────────────────────
     「４けたランダム数字ジェネレーター」を このタブに 入れたもの。
     こたえあわせは しない。数を 出して 読む／かくす だけ なので、
     はなまる・ばつ・10問チャレンジとは つながっていない。
     ========================================================= */
  var flD = 4;             // けた数（2・3・4）
  var flZeroOn = true;     // とちゅうの位に かならず 0 を 入れる
  var flNum = 1000;
  /* flHidden … カードを かくしているか。
     一度 かくしたら「つぎの数」でも かくれた まま 出る（書き取りの 練習）。
     「見せる」を おすまで ずっと つづく。 */
  var flHidden = false;
  var flSec = 3;           // じどうで めくる 間かく（秒）
  var flTimer = null;
  var FL_KETA = {2:'２', 3:'３', 4:'４'};

  var flDigitsEl = document.getElementById('fldigits');
  var flMaskEl   = document.getElementById('flmask');
  var flSecLbl   = document.getElementById('flSecLbl');
  var flAutoBtn  = document.getElementById('flAutoBtn');
  var flHideBtn  = document.getElementById('flHideBtn');
  var flZeroChk  = document.getElementById('flZero');
  var flSpeakChk = document.getElementById('flAutoSpeak');

  /* いちばん 上の 位は 0に しない（min が 10・100・1000 なので しぜんに そうなる）。
     flZeroOn の ときは 2けためから 下の どこかに かならず 0 が 入る。
     同じ数が 2回 つづけて 出ないように している。 */
  function flRand(d){
    var min = pow10(d-1), max = pow10(d)-1, n = flNum, s, i, has;
    for(var t=0; t<600; t++){
      n = rnd(min, max);
      if(n === flNum) continue;                       // 前と 同じは やりなおし
      if(!flZeroOn) return n;
      s = String(n); has = false;
      for(i=1; i<d; i++) if(s.charAt(i)==='0') has = true;
      if(has) return n;
    }
    return n;
  }

  // OSの 読み上げ。数字を そのまま わたすのが いちばん しぜんに 読まれる
  function flSpeak(){
    if(!('speechSynthesis' in window)) return;
    try{
      var u = new SpeechSynthesisUtterance(String(flNum));
      u.lang = 'ja-JP'; u.rate = 1; u.pitch = 1; u.volume = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(err){}
  }
  function flQuiet(){
    if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(err){} }
  }

  function renderFlash(){
    flDigitsEl.textContent = String(flNum);
    flDigitsEl.classList.toggle('off', flHidden);
    flMaskEl.textContent = new Array(flD+1).join('?');
    flMaskEl.style.display = flHidden ? '' : 'none';
    flHideBtn.textContent = flHidden ? '見せる' : 'かくす';
    flHideBtn.classList.toggle('on', flHidden);        // かくしている あいだ 光る
    flSecLbl.textContent = flSec + ' 秒';
    flAutoBtn.textContent = flTimer ? 'とめる' : 'スタート';
    flAutoBtn.classList.toggle('on', !!flTimer);
    Array.prototype.forEach.call(document.querySelectorAll('#flDigitChips button'), function(b){
      b.classList.toggle('on', Number(b.getAttribute('data-d'))===flD);
    });
    document.getElementById('flq').textContent =
      FL_KETA[flD] + 'けたの 数です。声に 出して 読もう。';
  }

  // つぎの数。かくしている あいだは かくれた ままで 出る
  function flNew(){
    flNum = flRand(flD);
    renderFlash();
    if(flSpeakChk.checked) flSpeak();
  }
  /* かくす ⇔ 見せる。かくすだけ。音は 出さない。
     音が ほしい ときは「読み上げ」ボタン、または
     右の「じどうで 読み上げる」に チェックを 入れる */
  function flToggleHide(){
    flHidden = !flHidden;
    renderFlash();
  }
  function flStopAuto(){ if(flTimer){ clearInterval(flTimer); flTimer=null; } }
  function flStartAuto(){ flStopAuto(); flTimer = setInterval(flNew, flSec*1000); }

  document.getElementById('flNextBtn').addEventListener('click', function(){ flNew(); this.blur(); });
  document.getElementById('flSpeakBtn').addEventListener('click', function(){ flSpeak(); this.blur(); });
  flHideBtn.addEventListener('click', function(){ flToggleHide(); this.blur(); });
  document.getElementById('flDigitChips').addEventListener('click', function(e){
    var t = e.target;
    if(!t || !t.getAttribute) return;
    var d = t.getAttribute('data-d');
    if(d===null) return;
    flD = Number(d); flNew(); t.blur();
  });
  flZeroChk.addEventListener('change', function(){ flZeroOn = flZeroChk.checked; flNew(); });
  Array.prototype.forEach.call(document.querySelectorAll('.fstep'), function(b){
    b.addEventListener('click', function(){
      flSec = Math.min(10, Math.max(1, flSec + Number(b.getAttribute('data-sec'))));
      if(flTimer) flStartAuto();                 // 動いている ときは 新しい 間かくで かけなおす
      renderFlash(); this.blur();
    });
  });
  flAutoBtn.addEventListener('click', function(){
    if(flTimer) flStopAuto(); else flStartAuto();
    renderFlash(); this.blur();
  });

  /* =========================================================
     タブ切りかえ
     ========================================================= */
  var TABS = {
    shikumi:{ tab:'tabShikumi', area:'shikumiArea', row:'rowShikumi',
            sub:'位取り表を 見て、位（くらい）を こたえよう。' },
    make: { tab:'tabMake', area:'makeArea', row:'rowMake',
            sub:'「1兆を6こ、10億を4こ あわせた数」の ような 問題です。' },
    nl:   { tab:'tabNL', area:'nlArea', row:'rowNL',
            sub:'矢印（↑）が さす 目もりは いくつかな？' },
    mul:  { tab:'tabMul', area:'mulArea', row:'rowMul',
            sub:'10倍・1/10 で 位が どう うごくかな？' },
    big:  { tab:'tabBig', area:'bigArea', row:'rowBig',
            sub:'0から9の 数字で 大きい 整数を つくろう。' },
    fude: { tab:'tabFude', area:'fudeArea', row:'rowFude',
            sub:'かける数を タップ。2だんめからは「ゆうれいの 0ちゃん」を 先に 書こう。' },
    flash:{ tab:'tabFlash', area:'flashArea', row:'rowFlash',
            sub:'４けたの 数を すらすら 読めるように しよう。' }
  };

  function setMode(m){
    cancelAuto(); fStop();
    flStopAuto(); flQuiet();   // ４けた練習の じどうめくり・読み上げは タブを 出たら とめる
    CH.reset();            // タブを かえたら 数えなおし
    // ４けた練習は こたえあわせが ないので、10問チャレンジとは いっしょに 使わない
    if(m==='flash') CH.stop();
    document.getElementById('chal-mount').style.display = (m==='flash') ? 'none' : '';
    mode = m;
    for(var key in TABS){
      if(!TABS.hasOwnProperty(key)) continue;
      document.getElementById(TABS[key].tab).classList.toggle('on', key===m);
      document.getElementById(TABS[key].area).style.display = (key===m) ? '' : 'none';
      document.getElementById(TABS[key].row).style.display = (key===m) ? '' : 'none';
    }
    document.getElementById('sub').textContent = TABS[m].sub;

    var useAns = (m==='shikumi') ? (sType==='w')
               : (m==='make' || m==='nl' || m==='mul' || m==='fude' || m==='big');
    document.getElementById('answerBox').style.display = useAns ? '' : 'none';
    // ４けた練習だけ、こたえ欄の かわりに 設定パネルを 右に 出す
    document.getElementById('flashSide').style.display = (m==='flash') ? '' : 'none';
    document.getElementById('unitPad').style.display = unitKeysOn() ? '' : 'none';
    document.getElementById('numPad').style.display = '';
    ans.style.display = '';
    clearAll();

    if(m==='shikumi'){ newShikumi(); renderShikumi(); }
    else if(m==='make'){ ans.placeholder='れい：70'; newMake(); renderMake(); }
    else if(m==='nl'){ ans.placeholder='れい：6000億'; newNL(); renderNL(); }
    else if(m==='mul'){ ans.placeholder='れい：560億'; newMul(xOp); renderMul(); }
    else if(m==='big'){ newBig(); renderBig(); }
    else if(m==='fude'){ newFude(fType); renderFude(); }
    else if(m==='flash'){ flNew(); }   // かくすモードは タブを 出入りしても つづく
  }
  document.getElementById('tabShikumi').addEventListener('click', function(){ if(mode!=='shikumi') setMode('shikumi'); });
  document.getElementById('tabMake').addEventListener('click',  function(){ if(mode!=='make')  setMode('make'); });
  document.getElementById('tabNL').addEventListener('click',    function(){ if(mode!=='nl')    setMode('nl'); });
  document.getElementById('tabMul').addEventListener('click',   function(){ if(mode!=='mul')   setMode('mul'); });
  document.getElementById('tabBig').addEventListener('click',   function(){ if(mode!=='big')  setMode('big'); });
  document.getElementById('tabFude').addEventListener('click',  function(){ if(mode!=='fude') setMode('fude'); });
  document.getElementById('tabFlash').addEventListener('click', function(){ if(mode!=='flash') setMode('flash'); });

  CH.init({
    mount: '#chal-mount',
    total: 10,
    next: nextAny,             // つぎの問題は いま開いている タブから 出す
    nextDelay: 3200,           // はなまるが 消えた あとも しばらく 問題を 見せる
    sound: null,
    record: false,             // 学校の 共用パソコンを 考えて 記録は 残さない
    recordKey: 'ookiikazu'
  });

  setMode('shikumi');
})();
</script>
</body>
</html>
