<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>大きい数</title>
<style>
  :root{
    --ink:#28323c; --line:#2a3742; --paper:#fbfaf5;
    --rule:#cfd8dd; --red:#e02424; --arrow:#f2602a; --hint:#ffd34d;
    --rand:#3a86d6; --regen:#34a87a; --check:#f2602a; --fbl:#1a6fd4;
    --key:#ffffff; --keyline:#d7dde1; --ok:#2f9e60; --ng:#d8533a; --hintlbl:#2f6fd0;
    --gridmax:20vh; --fmax:48vh;
    --chipgap:clamp(12px,3.4vh,38px);   /* チップ列と 問題文の あいだ */
    --fgap:clamp(8px,2.2vh,26px);       /* 筆算タブは 縦に よゆうが ないので 少なめ */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
    background:
      linear-gradient(0deg, rgba(0,0,0,0.015) 1px, transparent 1px) 0 0/100% 28px,
      var(--paper);
    color:var(--ink);
  }
  .wrap{
    height:100vh; height:100dvh;
    max-width:1180px;margin:0 auto;
    padding:clamp(6px,1.2vh,14px) clamp(8px,1.6vw,16px) clamp(6px,1.2vh,14px);
    display:flex;flex-direction:column;gap:clamp(4px,.9vh,10px);
  }

  /* 見出し＋タブ */
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{font-size:clamp(1.05rem,2.4vh,1.35rem);font-weight:800;margin:0;}
  .sub{font-size:clamp(.8rem,1.8vh,1.05rem);color:#6a7780;margin:0;}
  .levels{display:flex;gap:6px;flex-wrap:wrap;}
  .levels button{
    background:#eef2f4;color:#5a6772;border:2px solid var(--rule);box-shadow:none;
    padding:clamp(5px,1vh,9px) clamp(8px,1.4vw,15px);border-radius:11px;
    font-size:clamp(.88rem,2vh,1.15rem);
  }
  .levels button.on{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* 本体：左（問題）＋右（こたえ） */
  .main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,1vh,10px);}
  .left{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,1vh,10px);}
  .side{flex:0 0 auto;}

  .board{
    position:relative;flex:1 1 auto;min-height:0;overflow:auto;
    background:#fff;border:2px solid var(--rule);border-radius:16px;
    padding:clamp(6px,1.2vh,14px) 10px;
    box-shadow:0 5px 0 rgba(42,55,66,.06);
    display:flex;flex-direction:column;
  }
  .board>div{margin-top:auto;margin-bottom:auto;}
  audio{display:none;}
  svg{display:block;width:100%;height:auto;}
  #nl{max-height:26vh;}
  #kgrid,#rgrid,#wgrid,#mgrid,#fgrid{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #fwrap{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.5vw,18px);}
  #fwrap>#fgrid{flex:1 1 auto;min-width:0;}
  #fzero{flex:0 0 auto;}                                /* 出ていない ときも 場所を あけておく */
  #fzero .zrow{display:flex;gap:7px;margin-bottom:7px;justify-content:center;}
  #fzero button{
    display:flex;align-items:center;justify-content:center;
    width:clamp(42px,8.4vh,70px);height:clamp(40px,7.6vh,64px);
    padding:0;line-height:1;font-family:inherit;
    font-size:clamp(1rem,3vh,1.7rem);font-weight:800;color:var(--ink);
    border:2px solid #d5dde3;border-radius:12px;background:#fff;cursor:pointer;
  }
  #fzero button:active{background:#eaf1f6;}

  .ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 clamp(4px,.9vh,10px);}
  .ops button{
    background:#eef2f4;color:#3a4750;border:2px solid var(--rule);box-shadow:none;
    padding:clamp(5px,1vh,9px) clamp(8px,1.3vw,14px);border-radius:11px;
    font-size:clamp(.88rem,2vh,1.15rem);
  }
  .ops button.on{background:var(--rand);color:#fff;border-color:var(--rand);}
  /* 「大きい数のしくみ」は 上ぞろえ。3つの 問題で 位取り表が 同じ 場所に 来る */
  .board>#shikumiArea{margin-top:0;}

  .question{text-align:center;font-weight:800;font-size:clamp(1rem,2.4vh,1.45rem);margin:clamp(4px,1vh,10px) 2px 0;line-height:1.6;}
  .question .u{color:#6a7780;font-weight:700;}
  .qbig{text-align:center;font-weight:900;font-size:clamp(1.2rem,3.3vh,2.05rem);margin:clamp(2px,.6vh,8px) 0;letter-spacing:.03em;}
  /* たし算・ひき算は 字が みじかいので 大きく */
  .qbig.big{font-size:clamp(1.6rem,4.6vh,2.9rem);}
  /* 漢数字の「兆・億・万」を 赤い ○で かこむ（ヒント）。
     ○は うしろに かさねて かくので、出しても 字の 場所は うごかない */
  .qbig .uc{position:relative;display:inline-block;}
  .qbig.hint .uc::after{
    content:'';position:absolute;left:50%;top:50%;width:1.36em;height:1.36em;
    transform:translate(-50%,-50%);border:3px solid var(--red);border-radius:50%;pointer-events:none;
  }
  /* 大小くらべの ㋐㋑は、上の 問題文と 下の えらび肢から すこし はなす */
  .qbig.cmp{margin:clamp(10px,2.6vh,28px) 0;}
  /* 場所とりの 位取り表に 筆算を かさねる（あわせた数タブの ヒント） */
  .movl{position:relative;}
  .movlin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .movlin svg{width:auto;height:100%;max-width:100%;}
  #xtyped{
    width:min(100%,440px);margin:0 auto;
    border:3px solid var(--keyline);border-radius:14px;background:#fdfdfb;
    text-align:center;font-weight:900;letter-spacing:.02em;line-height:1.5;
    font-size:clamp(1.4rem,4.6vh,2.8rem);padding:clamp(3px,.8vh,9px) 8px;
    display:flex;align-items:center;justify-content:center;
    /* 空でも 書いても 同じ 高さ（1行ぶん＋内よはく＋線） */
    height:calc(1.5em + clamp(6px,1.6vh,18px) + 6px);
  }
  #xtyped.ok{border-color:var(--ok);color:var(--ok);}
  #xtyped.ng{border-color:var(--ng);}
  .revealmul{text-align:center;font-weight:900;font-size:clamp(1rem,2.4vh,1.5rem);color:var(--red);min-height:1.3em;margin:2px 0 0;}
  .note{text-align:center;font-size:clamp(.82rem,1.8vh,1.1rem);color:#6a7780;margin:2px 0 0;}

  .pchoices{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(4px,.8vh,8px);margin:clamp(4px,1vh,10px) 2px 0;}
  .pchoices button{
    background:#fff;color:var(--ink);border:2px solid var(--keyline);box-shadow:0 3px 0 #e3e8eb;
    font-size:clamp(.85rem,2.1vh,1.32rem);font-weight:800;white-space:nowrap;
    padding:clamp(6px,1.3vh,12px) 1px;border-radius:11px;letter-spacing:-.02em;
  }
  .pchoices button:active{box-shadow:0 1px 0 #e3e8eb;}
  .pchoices button.on{background:var(--rand);color:#fff;border-color:var(--rand);}
  .pchoices.dig{grid-template-columns:repeat(10,1fr);}
  .pchoices.dig button{font-size:clamp(1.1rem,2.7vh,1.85rem);}
  /* 読み方（漢数字）は 長いので たてに 1つずつ */
  .pchoices.long{grid-template-columns:1fr;gap:clamp(3px,.7vh,7px);}
  .pchoices.long button{
    white-space:normal;letter-spacing:.03em;
    font-size:clamp(1rem,2.4vh,1.45rem);padding:clamp(5px,1.1vh,11px) 8px;
  }

  .cfb{text-align:center;font-weight:900;font-size:clamp(1.05rem,2.6vh,1.6rem);min-height:1.4em;margin:clamp(2px,.6vh,8px) 0 0;}
  .cfb.ok{color:var(--ok);} .cfb.ng{color:var(--ng);} .cfb.neutral{color:#6a7780;font-size:clamp(.9rem,2.1vh,1.25rem);}

  /* はなまる／ばつ */
  .maru,.batsu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:5;opacity:0;visibility:hidden;transition:opacity .55s ease, visibility .55s ease;}
  .maru.show,.batsu.show{opacity:1;visibility:visible;transition:opacity .12s ease, visibility 0s;}
  /* はなまるは もとの 2ばい。たてが はみ出す ときは
     object-fit で 形を たもったまま 縮める */
  .maru img{width:68%;max-width:380px;height:auto;max-height:100%;object-fit:contain;
    filter:drop-shadow(0 6px 14px rgba(224,36,36,.25));}
  .batsu svg{width:28%;max-width:150px;height:auto;filter:drop-shadow(0 6px 14px rgba(224,36,36,.25));}
  .maru.show img,.batsu.show svg{animation:pop .5s cubic-bezier(.18,1.5,.4,1) both;}
  @keyframes pop{0%{transform:scale(.2) rotate(-18deg);opacity:0;}60%{transform:scale(1.12) rotate(6deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
  @media(prefers-reduced-motion:reduce){ .maru img,.batsu svg{animation:none;} }

  /* 操作ボタン列 */
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:800;color:#fff;
    padding:clamp(7px,1.5vh,14px) clamp(11px,1.7vw,20px);font-size:clamp(.86rem,2vh,1.18rem);
    box-shadow:0 3px 0 rgba(0,0,0,.16);transition:transform .04s, box-shadow .04s;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.16);}
  button:focus-visible{outline:3px solid #2a3742;outline-offset:2px;}
  .b-hint{background:var(--hint);color:#5a4a00;}
  .b-hint.on{background:#ffbf1f;color:#5a4a00;box-shadow:inset 0 0 0 3px #fff,0 3px 0 rgba(0,0,0,.16);}
  .b-rand{background:var(--rand);} .b-regen{background:var(--regen);} .b-reveal{background:#8a97a0;}

  /* こたえ */
  .side{
    background:#fff;border:2px solid var(--rule);border-radius:16px;
    padding:clamp(7px,1.3vh,14px);box-shadow:0 5px 0 rgba(42,55,66,.06);
    display:flex;flex-direction:column;gap:clamp(4px,.9vh,9px);
  }
  #ans{
    width:100%;font-family:inherit;font-weight:800;
    font-size:clamp(1.15rem,2.9vh,1.95rem);text-align:center;
    padding:clamp(5px,1.1vh,10px) 8px;border:3px solid var(--keyline);border-radius:12px;
    background:#fdfdfb;color:var(--ink);
  }
  #ans:focus{outline:none;border-color:var(--rand);}
  .ansbtns{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;}
  .b-check{background:var(--check);}
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(4px,.9vh,9px);}
  .pad3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,.9vh,9px);}
  .pad button,.pad3 button{
    background:var(--key);color:var(--ink);font-size:clamp(1.05rem,2.6vh,1.65rem);
    padding:clamp(5px,1.3vh,14px) 0;border:2px solid var(--keyline);box-shadow:0 3px 0 #e3e8eb;
  }
  .pad button:active,.pad3 button:active{box-shadow:0 1px 0 #e3e8eb;}
  .k-zero{font-size:clamp(.9rem,2.1vh,1.25rem)!important;color:#3a4750;}
  .k-back{color:#6a7780;}
  .k-wide{grid-column:span 2;}
  .k-unit{color:var(--rand)!important;}
  .k-clear{background:#fdeee9!important;color:var(--ng)!important;border-color:#f3cdc0!important;box-shadow:0 3px 0 #f0d6cb!important;font-size:clamp(.8rem,1.9vh,1.12rem)!important;}
  .fb{min-height:1.4em;text-align:center;font-weight:900;font-size:clamp(1.05rem,2.5vh,1.55rem);}
  .fb.ok{color:var(--ok);} .fb.ng{color:var(--ng);} .fb.neutral{color:#6a7780;font-size:.95rem;}

  /* 広い画面は左右2カラム */
  @media(min-width:840px){
    .main{flex-direction:row;}
    .left{flex:1 1 auto;min-width:0;}
    .side{flex:0 0 clamp(250px,26vw,320px);}
    :root{--gridmax:26vh;--fmax:54vh;}
  }
  /* せまい画面 */
  @media(max-width:839px){
    :root{--gridmax:17vh;--fmax:36vh;}
    #nl{max-height:20vh;}
    .pchoices{grid-template-columns:repeat(5,1fr);}
    .pchoices.dig{grid-template-columns:repeat(5,1fr);}
  }
  @media(max-height:620px){ .sub{display:none;} }

  /* チップ列と 問題文を 少し はなす。
     あわせた数タブは 4つの 問題ぜんぶに 同じだけ 足すので、
     位取り表が あっても なくても チップ列の 高さは そろったまま */
  #mq,#xq,#bq{padding-top:var(--chipgap);}
  /* たし算・ひき算だけ 字を 大きくするので、ほかの 3つにも 同じ 高さを もたせる。
     こうしないと チップ列が 上下に うごく（#mspace の 高さそろえと 同じ かんがえ方） */
  #mq{min-height:calc(var(--chipgap) + clamp(1.6rem,4.6vh,2.9rem) * 1.45);}
  /* ヒントの 1行（「1兆が（56－44）こ ぶん。」）は 出ていない ときも
     場所を あけておく。出した ときに 問題文が 上に うごかない */
  #mnote{min-height:1.45em;line-height:1.45;}
  /* 10倍・1/10 の ヒントも 2行ぶん 先に 場所を あけておく */
  #xnote{min-height:2.9em;line-height:1.45;}
  /* 筆算タブ。はなした ぶんだけ 筆算の 高さの 上限を さげるので、
     ぜんたいが 画面から はみ出さない */
  #fq,#fxArea>.question{padding-top:var(--fgap);}

  /* 数をつくる／まちがいさがし */
  .bline{
    display:flex;align-items:center;justify-content:center;
    background:#fff8d6;border:2px solid #e8d98a;border-radius:12px;
    padding:clamp(3px,.8vh,8px) 10px;margin:clamp(3px,.8vh,8px) auto;
    max-width:min(100%,600px);
  }
  .blbl{flex:0 0 1.9em;text-align:center;}
  .bcell{
    flex:0 0 1.5em;text-align:center;line-height:1.25;
    border:3px solid transparent;border-radius:8px;   /* □と 高さを そろえる */
  }
  .bbox{border-color:var(--red);background:#fff;}
  .bdim{opacity:.18;}                                  /* ヒント：同じ 上の位を うっすら */
  #fxsent,#fxq2{
    text-align:left;line-height:2.0;max-width:min(100%,760px);margin:clamp(4px,1vh,10px) auto 0;
    font-size:clamp(1rem,2.9vh,1.65rem);font-weight:800;
  }
  #fxsent{
    border:3px solid var(--arrow);border-radius:14px;padding:clamp(6px,1.2vh,12px) 16px;
    width:max-content;max-width:min(100%,900px);   /* 文の 長さぶんだけ */
  }
  #fxq2{text-align:center;}
  .fxbox{
    display:inline-block;min-width:2.6em;padding:2px 8px;margin:0 5px;
    border:3px solid var(--keyline);border-radius:10px;background:#fdfdfb;
    font-weight:900;text-align:center;color:var(--ink);cursor:pointer;min-height:1.4em;
  }
  .fxbox.sel{border-color:var(--rand);background:rgba(58,134,214,.14);}
  .fxbox.ok{border-color:var(--ok);color:var(--ok);}
  .fxbox.ng{border-color:var(--ng);color:var(--ng);}
  #fxgrid svg{max-height:calc(26vh - var(--fgap));}

  /* =========================================================
     ⑩ ４けた練習（フラッシュカード）
     ・タブは この1つだけ 赤。練習用だと すぐ 分かるように
     ・左＝カード／右＝設定。カードの 高さは 固定なので
       「かくす」を おしても 画面が うごかない（8節の 考え方）
     ========================================================= */
  #tabFlash{background:#fdecea;color:#c0201d;border-color:#f0b6b0;}
  #tabFlash.on{background:var(--red);color:#fff;border-color:var(--red);}

  #flcard{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    width:min(100%,760px);margin:clamp(6px,1.6vh,18px) auto 0;
    height:clamp(120px,30vh,280px);
    border:3px solid var(--keyline);border-radius:20px;background:#fdfdfb;
  }
  #fldigits,#flmask{
    font-weight:900;line-height:1;letter-spacing:.1em;
    /* たてにも よこにも 入るように。スマホでも はみ出さない */
    font-size:clamp(2.2rem, min(15vh, 15vw), 8.4rem);
    font-variant-numeric:tabular-nums;
  }
  #fldigits{color:var(--ink);transition:opacity .22s ease;}
  #fldigits.off{opacity:0;}                 /* 場所は とったまま 消す */
  /* かくしている あいだの うすい「?」。カードが こわれて 見えないように */
  #flmask{position:absolute;color:#dfe6eb;pointer-events:none;}

  /* 右がわの 設定パネル */
  .fset{border:2px solid var(--rule);border-radius:12px;padding:clamp(6px,1.1vh,11px) 10px;}
  .fset h3{
    margin:0 0 clamp(4px,.8vh,8px);font-weight:800;color:#6a7780;
    font-size:clamp(.8rem,1.8vh,1.02rem);
  }
  .fchips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .fchips button{
    background:#eef2f4;color:#3a4750;border:2px solid var(--rule);box-shadow:none;
    padding:clamp(5px,1vh,9px) 2px;border-radius:10px;
    font-size:clamp(.82rem,1.9vh,1.08rem);
  }
  .fchips button.on{background:var(--red);color:#fff;border-color:var(--red);}
  .fopt{
    display:flex;align-items:center;gap:8px;line-height:1.4;font-weight:700;
    font-size:clamp(.78rem,1.75vh,1rem);cursor:pointer;
  }
  .fopt+.fopt{margin-top:clamp(4px,.9vh,9px);}
  .fopt input[type="checkbox"]{
    flex:0 0 auto;width:1.3em;height:1.3em;accent-color:var(--red);cursor:pointer;
  }
  .fhelp{margin:clamp(4px,.9vh,8px) 0 0;color:#8a959c;line-height:1.45;
    font-size:clamp(.68rem,1.5vh,.86rem);}
  .fstep{
    background:#eef2f4;color:#3a4750;border:2px solid var(--rule);box-shadow:none;
    width:2.3em;padding:clamp(3px,.7vh,7px) 0;border-radius:9px;
    font-size:clamp(.9rem,2vh,1.15rem);
  }
  #flSecLbl{flex:1 1 auto;text-align:center;font-weight:900;}
  .frow{margin-top:clamp(5px,1vh,10px);}
  .frow button{width:100%;}
  #flAutoBtn.on{background:var(--red);}

  /* 10問チャレンジ（challenge10 のCSSを この画面の大きさに あわせる） */
  #chal-mount{margin-left:auto;}
  #chal-wrap #btn-challenge{
    font-size:clamp(.78rem,1.8vh,1.02rem);
    padding:clamp(4px,.9vh,8px) clamp(8px,1.4vw,16px);
  }
  #chal-wrap #chal-bar{
    font-size:clamp(.75rem,1.7vh,.98rem);
    padding:clamp(3px,.7vh,6px) clamp(8px,1.2vw,14px);
  }
  #chal-wrap #chal-dots{font-size:clamp(.8rem,1.9vh,1.05rem);letter-spacing:1px;}
  @media(max-width:600px){ #chal-mount{margin-left:0;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>大きい数</h1>
    <p class="sub" id="sub">億・兆までの 大きい数を おぼえよう。</p>
    <div id="chal-mount"></div>
  </div>

  <div class="levels">
    <button id="tabShikumi" class="on">大きい数のしくみ</button>
    <button id="tabMake">あわせた数</button>
    <button id="tabNL">数直線</button>
    <button id="tabMul">10倍・1/10</button>
    <button id="tabBig">応用問題</button>
    <button id="tabFude">かけ算の筆算</button>
    <button id="tabFlash">４けた練習</button>
  </div>

  <div class="main">
    <div class="left">
      <div class="board">

        <div id="shikumiArea">
          <div class="ops" id="sops">
            <button data-sq="q1" class="on">何の位</button>
            <button data-sq="q3">何が何こ</button>
            <button data-sq="r">読み方</button>
            <button data-sq="w">数字で書く</button>
            <button data-sq="rand">ランダム</button>
          </div>

          <div id="kuraiArea">
            <div id="kgrid"></div>
            <p class="question" id="kq"></p>
            <div class="pchoices" id="kchoices"></div>
            <p class="cfb" id="kfb"></p>
          </div>

          <div id="readArea" style="display:none">

<!-- ===== 10問チャレンジ（challenge10.js の中身を そのまま 入れてあります） ===== -->
<script>
/* ============================================================
   challenge10.js  —  「10問チャレンジ」だけを取り出したもの
   ------------------------------------------------------------
   もと：warizan81_kangae.html（小数のかけ算とわり算の筆算）⑪81
   どんなアプリでも使えるように、CSS と HTML も中に入れてあります。
   ほかのファイルは いりません（ライブラリなし・ネットもいらない）。

   ■ 使いかた（3つ呼ぶだけ）
     1. Challenge10.init({ mount: '#どこか', next: () => 次の問題を出す関数() })
     2. 1問できたら          Challenge10.done()
     3. まちがえたら          Challenge10.miss()

   ■ そのほか
     Challenge10.newProblem()  … 新しい問題を出したとき（その問題のミス数を0に）
     Challenge10.reset()       … 数えなおす（タブを変えたときなど）
     Challenge10.isOn()        … いまチャレンジ中か
     Challenge10.stop()        … チャレンジをやめる
     Challenge10.state         … {on, total, no, miss, missNow, perfect, t0}

   ■ init に わたせるもの（ぜんぶ省略できます）
     mount       ボタンを置く場所。'#id' か 要素。省略すると <body> の先頭
     total       何問にするか（初期値 10）
     next        次の問題を出す関数。これがないと自動で次に進みません
     nextDelay   はなまるから次の問題までの待ち時間 ms（初期値 1800）
     resultDelay 最後の問題から成せき表までの待ち時間 ms（初期値 1500）
     label       ボタンの文字（初期値 '🏁 10問チャレンジ'）
     sound       ボタンを押したとき鳴らす関数（例: () => playSound('click')）
     onToggle    on/off が変わったとき呼ばれる関数 (on) => {}
     onFinish    10問おわったとき呼ばれる関数 (成せき) => {}
     record      true にすると、その日の最高記録を localStorage に残す
     recordKey   記録の名前（アプリごとに変える。初期値 'challenge10'）
     css         false にすると 見た目のCSSを入れない（自分で書くとき）
   ============================================================ */
(function (global) {
    'use strict';

    var CSS = `
    .chal-btn {
        font-size: 1rem; font-weight: bold; color: #6a1b9a;
        background: #f3e5f5; border: 2px solid #ce93d8; border-radius: 20px;
        padding: 7px 16px; box-shadow: 0 2px 0 #ce93d8; cursor: pointer;
        font-family: inherit;
    }
    .chal-btn.on { color: #fff; background: #8e24aa; border-color: #6a1b9a; box-shadow: 0 2px 0 #4a148c; }
    .chal-btn:focus-visible, .chal-btns button:focus-visible { outline: 3px solid #8e24aa; outline-offset: 2px; }
    #chal-bar {
        display: none; align-items: center; gap: 10px;
        background: rgba(255,255,255,0.9); border-radius: 20px; padding: 6px 16px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        font-weight: bold; color: #6a1b9a; white-space: nowrap;
    }
    #chal-dots { color: #8e24aa; letter-spacing: 2px; font-size: 1.05rem; }
    #chal-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    /* おわったときの成せき表 */
    #chal-result {
        display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.45); z-index: 900;
        align-items: center; justify-content: center;
    }
    #chal-result.show { display: flex; }
    .chal-card {
        background: #fff; border-radius: 20px; padding: 28px 34px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 90vw;
    }
    .chal-title { font-size: 1.8rem; font-weight: bold; color: #8e24aa; margin-bottom: 14px; }
    .chal-lines { font-size: 1.25rem; font-weight: bold; color: #333; line-height: 2; }
    .chal-lines b { color: #e53935; font-size: 1.5rem; }
    .chal-msg { margin-top: 10px; color: #ff6f00; }
    .chal-best { margin-top: 6px; font-size: 1rem; color: #6a1b9a; }
    .chal-btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
    .chal-btns button {
        padding: 12px 20px; font-size: 1.1rem; font-weight: bold; font-family: inherit;
        border-radius: 14px; cursor: pointer; border: none;
    }
    #btn-chal-again { color: #fff; background: #8e24aa; box-shadow: 0 3px 0 #4a148c; }
    #btn-chal-quit  { color: #6a1b9a; background: #f3e5f5; border: 2px solid #ce93d8; }
    @media (prefers-reduced-motion: reduce) { .chal-btn, .chal-btns button { transition: none; } }
    `;

    var BAR_HTML =
        '<button id="btn-challenge" class="chal-btn" type="button"></button>' +
        '<div id="chal-bar"><span id="chal-dots"></span><span id="chal-count"></span></div>';

    var RESULT_HTML =
        '<div class="chal-card">' +
        '  <div class="chal-title">🏁 <span id="chal-total-title"></span>問 できました！</div>' +
        '  <div class="chal-lines" id="chal-lines"></div>' +
        '  <div class="chal-btns">' +
        '    <button id="btn-chal-again" type="button">もう一度チャレンジ</button>' +
        '    <button id="btn-chal-quit" type="button">やめる</button>' +
        '  </div>' +
        '</div>';

    var cfg = null;
    var chal = { on: false, total: 10, no: 0, miss: 0, missNow: 0, perfect: 0, t0: 0 };
    var $ = function (id) { return document.getElementById(id); };

    // --- きょうの記録（localStorage。使えないときは だまって何もしない）---
    function todayKey() {
        var d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function loadBest() {
        if (!cfg.record) return null;
        try {
            var raw = localStorage.getItem(cfg.recordKey);
            if (!raw) return null;
            var o = JSON.parse(raw);
            // その日の記録だけ／問題数がちがう記録はまぜない
            return (o && o.day === todayKey() && o.total === chal.total) ? o : null;
        } catch (e) { return null; }
    }
    function saveBest(perfect, sec) {
        if (!cfg.record) return null;
        var best = loadBest();
        // ノーミスの数が多いほうが上。同じなら 時間が短いほう
        if (best && (best.perfect > perfect || (best.perfect === perfect && best.sec <= sec))) return best;
        var o = { day: todayKey(), perfect: perfect, sec: sec, total: chal.total };
        try { localStorage.setItem(cfg.recordKey, JSON.stringify(o)); } catch (e) { }
        return o;
    }

    // --- 帯（○○○●…）の書きかえ ---
    function chalUpdateBar() {
        $('btn-challenge').classList.toggle('on', chal.on);
        $('chal-bar').style.display = chal.on ? 'flex' : 'none';
        if (!chal.on) return;
        var dots = '';
        for (var i = 0; i < chal.total; i++) dots += (i < chal.no) ? '●' : '○';
        $('chal-dots').innerText = dots;
        $('chal-count').innerText = Math.min(chal.no + 1, chal.total) + '問め / ' + chal.total;
    }

    // --- はじめから数えなおす ---
    function chalReset() {
        chal.no = 0; chal.miss = 0; chal.missNow = 0; chal.perfect = 0; chal.t0 = Date.now();
        $('chal-result').classList.remove('show');
        chalUpdateBar();
    }

    // --- 1問おわったときに呼ぶ ---
    function chalDone() {
        if (!chal.on) return;
        if (chal.missNow === 0) chal.perfect++;
        chal.no++;
        chalUpdateBar();
        if (chal.no < chal.total) {
            setTimeout(function () {         // つぎの問題へ
                if (!chal.on) return;
                chal.missNow = 0;
                if (cfg.next) cfg.next();
            }, cfg.nextDelay);
            return;
        }
        var sec = Math.floor((Date.now() - chal.t0) / 1000);
        var msg = (chal.perfect === chal.total) ? 'ぜんぶノーミス！ すばらしい！'
                : (chal.perfect >= chal.total - 2) ? 'よくがんばりました！'
                : 'つぎは もっとできる！';
        var best = saveBest(chal.perfect, sec);
        var result = { perfect: chal.perfect, miss: chal.miss, sec: sec, total: chal.total };
        setTimeout(function () {
            $('chal-total-title').innerText = chal.total;
            $('chal-lines').innerHTML =
                '<div>ノーミスでできた問題　<b>' + chal.perfect + '</b> / ' + chal.total + '</div>' +
                '<div>まちがえた回数　<b>' + chal.miss + '</b> 回</div>' +
                '<div>かかった時間　<b>' + Math.floor(sec / 60) + '</b> 分 <b>' + (sec % 60) + '</b> 秒</div>' +
                '<div class="chal-msg">' + msg + '</div>' +
                (best ? '<div class="chal-best">きょうの最高記録　ノーミス ' + best.perfect + ' / ' + best.total +
                        ' 問　　' + Math.floor(best.sec / 60) + '分' + (best.sec % 60) + '秒</div>' : '');
            $('chal-result').classList.add('show');
            $('btn-chal-again').focus();
            if (cfg.onFinish) cfg.onFinish(result);
        }, cfg.resultDelay);
    }

    // --- はじめの用意 ---
    function init(opt) {
        opt = opt || {};
        cfg = {
            total: opt.total || 10,
            next: opt.next || null,
            nextDelay: (opt.nextDelay === undefined) ? 1800 : opt.nextDelay,
            resultDelay: (opt.resultDelay === undefined) ? 1500 : opt.resultDelay,
            label: opt.label || '🏁 10問チャレンジ',
            sound: opt.sound || null,
            onToggle: opt.onToggle || null,
            onFinish: opt.onFinish || null,
            record: !!opt.record,
            recordKey: opt.recordKey || 'challenge10',
            css: (opt.css === undefined) ? true : opt.css
        };
        chal.total = cfg.total;
        if (opt.label === undefined && cfg.total !== 10) cfg.label = '🏁 ' + cfg.total + '問チャレンジ';

        // CSS
        if (cfg.css && !$('chal-style')) {
            var st = document.createElement('style');
            st.id = 'chal-style';
            st.textContent = CSS;
            document.head.appendChild(st);
        }
        // ボタンと帯
        var host = (typeof opt.mount === 'string') ? document.querySelector(opt.mount) : opt.mount;
        var wrap = $('chal-wrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'chal-wrap';
            wrap.innerHTML = BAR_HTML;
            if (host) host.appendChild(wrap);
            else document.body.insertBefore(wrap, document.body.firstChild);
        }
        // 成せき表
        if (!$('chal-result')) {
            var res = document.createElement('div');
            res.id = 'chal-result';
            res.innerHTML = RESULT_HTML;
            document.body.appendChild(res);
        }
        $('btn-challenge').innerText = cfg.label;

        $('btn-challenge').addEventListener('click', function () {
            chal.on = !chal.on;
            if (cfg.sound) cfg.sound();
            chalReset();
            if (cfg.onToggle) cfg.onToggle(chal.on);
            if (cfg.next) cfg.next();
        });
        $('btn-chal-again').addEventListener('click', function () {
            chalReset();
            if (cfg.next) cfg.next();
        });
        $('btn-chal-quit').addEventListener('click', function () {
            chal.on = false;
            chalReset();
            if (cfg.onToggle) cfg.onToggle(false);
            if (cfg.next) cfg.next();
        });

        chalUpdateBar();
        return API;
    }

    var API = {
        init: init,
        done: chalDone,                                        // 1問できた
        miss: function () { if (chal.on) { chal.miss++; chal.missNow++; } },  // まちがえた
        newProblem: function () { chal.missNow = 0; },          // 新しい問題を出した
        reset: chalReset,                                       // 数えなおす
        stop: function () { chal.on = false; chalReset(); },    // やめる
        isOn: function () { return chal.on; },
        updateBar: chalUpdateBar,
        setTotal: function (n) { chal.total = cfg.total = n; chalReset(); },
        state: chal
    };

    global.Challenge10 = API;
    if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : this);

</script>

<script>

(function(){
  "use strict";

  /* 10問チャレンジ（challenge10）。読みこめていなくても アプリは動く */
  var CH = (typeof Challenge10 !== 'undefined') ? Challenge10 : {
    init:function(){}, done:function(){}, miss:function(){},
    newProblem:function(){}, reset:function(){}, stop:function(){},
    isOn:function(){ return false; }
  };

  /* =========================================================
     きほんの道具
     ========================================================= */
  var PLACE = ['一','十','百','千','一万','十万','百万','千万','一億','十億','百億','千億','一兆','十兆'];
  var UNITV = ['1','10','100','1000','1万','10万','100万','1000万','1億','10億','100億','1000億','1兆','10兆'];
  var K = ['','一','二','三','四','五','六','七','八','九'];

  function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function pick(arr){ return arr[rnd(0,arr.length-1)]; }
  function pow10(n){ return Math.pow(10,n); }

  // 4けたを漢数字に（1234→千二百三十四）
  function kanji4(n){
    var a=Math.floor(n/1000)%10, b=Math.floor(n/100)%10, c=Math.floor(n/10)%10, d=n%10, s='';
    if(a) s += (a===1?'':K[a]) + '千';
    if(b) s += (b===1?'':K[b]) + '百';
    if(c) s += (c===1?'':K[c]) + '十';
    if(d) s += K[d];
    return s;
  }
  // 数を漢数字に（二億六千五百万 など）
  function kanjiNum(v){
    if(v===0) return '〇';
    var t=Math.floor(v/1e12), o=Math.floor(v/1e8)%10000, m=Math.floor(v/1e4)%10000, r=v%10000, s='';
    if(t) s += kanji4(t)+'兆';
    if(o) s += kanji4(o)+'億';
    if(m) s += kanji4(m)+'万';
    if(r) s += kanji4(r);
    return s;
  }
  // 漢数字の「兆・億・万」を まるで かこめるように つつむ（ヒントで 赤い ○に なる）
  function markUnits(s){
    return String(s).replace(/[兆億万]/g, function(c){ return '<span class="uc">'+c+'</span>'; });
  }
  // 数を「1兆400億」のような言い方に
  function bigLabel(v){
    if(v===0) return '0';
    var t=Math.floor(v/1e12), o=Math.floor(v/1e8)%10000, m=Math.floor(v/1e4)%10000, r=v%10000, s='';
    if(t) s += t+'兆';
    if(o) s += o+'億';
    if(m) s += m+'万';
    if(r) s += r;
    return s;
  }
  // 「1兆400億」「6000億」「600000000000」→ 数
  function parseBig(s){
    s = (s||'').replace(/\s/g,'');
    if(s==='') return null;
    if(!/^[0-9兆億万]+$/.test(s)) return null;
    var total=0, cur='';
    for(var i=0;i<s.length;i++){
      var ch=s.charAt(i);
      if(ch>='0' && ch<='9'){ cur += ch; }
      else{
        if(cur==='') return null;
        var mul = (ch==='兆')?1e12 : (ch==='億')?1e8 : 1e4;
        total += Number(cur)*mul; cur='';
      }
    }
    if(cur!=='') total += Number(cur);
    return total;
  }
  // 4けたごとに区切って表示（HTML）
  function spacedHtml(str){
    var groups=[], i=str.length;
    while(i>0){ groups.unshift(str.slice(Math.max(0,i-4), i)); i-=4; }
    return groups.map(function(g){ return '<span class="g">'+g+'</span>'; }).join('');
  }

  /* =========================================================
     位取り表（SVG）
     opt = { cells, digits, chars, sel, mark, units, hl, click }
       units … 下の「兆・億・万」を 出す（ヒントの とき だけ true）
       hl    … 赤い しかく。{ base:きじゅんの位, top:こたえの いちばん上の位 }
     ========================================================= */
  var GC = 58;
  function buildGrid(opt){
    var n = opt.cells, dg = String(opt.digits||''), mark = (opt.mark===undefined)?-1:opt.mark;
    var PADL=8, PADR=8, TOP=48, H=76, yb=TOP+H;
    var VW = n*GC + PADL + PADR, VH = yb + 36;
    var s = '<svg viewBox="0 0 '+VW+' '+VH+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-height:var(--gridmax)">';

    // わく
    s += '<rect x="'+PADL+'" y="'+TOP+'" width="'+(n*GC)+'" height="'+H+'" rx="4" fill="none" stroke="var(--line)" stroke-width="3"/>';
    for(var i=1;i<n;i++){
      var x = PADL + i*GC, fromRight = n-i;
      var thick = (fromRight%4===0);
      s += '<line x1="'+x+'" y1="'+TOP+'" x2="'+x+'" y2="'+yb+'" stroke="'+(thick?'var(--line)':'#b9c2c7')+'" stroke-width="'+(thick?3:1.4)+'"'+(thick?'':' stroke-dasharray="5 4"')+'/>';
    }

    // 数字（右づめ）
    for(var d=0; d<dg.length && d<n; d++){
      var idxFromRight = dg.length-1-d;
      var col = n-1-idxFromRight;
      var cx = PADL + col*GC + GC/2;
      s += '<text x="'+cx+'" y="'+(TOP+56)+'" text-anchor="middle" font-size="52" font-weight="800" fill="var(--ink)">'+dg.charAt(d)+'</text>';
    }

    // マスごとの文字（「位の数字」モードでクリックして入れる）
    if(opt.chars){
      if(opt.sel>=0 && opt.sel<n){
        var sx = PADL + opt.sel*GC;
        s += '<rect x="'+(sx+3)+'" y="'+(TOP+3)+'" width="'+(GC-6)+'" height="'+(H-6)+'" rx="5" fill="rgba(58,134,214,.16)" stroke="var(--rand)" stroke-width="3"/>';
      }
      for(var q=0;q<n;q++){
        var chq = opt.chars[q];
        if(chq===null || chq===undefined || chq==='') continue;
        var cxq = PADL + q*GC + GC/2;
        var col = (opt.hi===q) ? 'var(--red)' : 'var(--ink)';
        s += '<text x="'+cxq+'" y="'+(TOP+56)+'" text-anchor="middle" font-size="52" font-weight="800" fill="'+col+'">'+chq+'</text>';
      }
    }

    // ▼ しるし
    if(mark>=0 && mark<n){
      var mcol = n-1-mark, mx = PADL + mcol*GC + GC/2;
      s += '<path d="M '+(mx-13)+' '+(TOP-22)+' L '+(mx+13)+' '+(TOP-22)+' L '+mx+' '+(TOP-4)+' Z" fill="var(--arrow)"/>';
    }

    // 下の「兆・億・万」。ヒントの ときだけ 出す（opt.units）
    if(opt.units){
      var labels = [[12,'兆'],[8,'億'],[4,'万']];
      for(var g=0; g<labels.length; g++){
        var fr0 = labels[g][0];
        if(fr0 <= n-1){
          var cxg = PADL + (n-1-fr0)*GC + GC/2;   // その位（一兆・一億・一万）のマスの下
          s += '<text x="'+cxg+'" y="'+(yb+27)+'" text-anchor="middle" font-size="24" font-weight="800" fill="#8a97a0">'+labels[g][1]+'</text>';
        }
      }
    }
    // 「一の位」は きじゅんに なるので いつも 出す
    var lx = PADL + (n-1)*GC + GC/2;
    s += '<text x="'+lx+'" y="'+(yb+26)+'" text-anchor="middle" font-size="16" font-weight="800" fill="#c08a00">一の位</text>';

    /* 赤い しかく（ヒント）
       opt.hl = { base:きじゅんに する 位, top:こたえの いちばん 上の 位 }
       こたえが 入る 位 ぜんぶを ひとまとめに かこむ。右から かぞえた ばんごうで わたす  */
    if(opt.hl && opt.hl.base>=0 && opt.hl.base<=n-1){
      var hb = opt.hl.base;
      var ht = (opt.hl.top===undefined || opt.hl.top<hb) ? hb : opt.hl.top;
      if(ht>n-1) ht = n-1;
      var hx0 = Math.max(2, PADL + (n-1-ht)*GC - 6);
      var hx1 = Math.min(VW-2, PADL + (n-hb)*GC + 6);
      s += '<rect x="'+hx0+'" y="'+(TOP-14)+'" width="'+(hx1-hx0)+'" height="'+(H+48)+'" rx="7" '+
           'fill="none" stroke="var(--red)" stroke-width="2.5" opacity=".8"/>';
    }

    if(opt.click){
      for(var cc=0; cc<n; cc++){
        s += '<rect data-i="'+cc+'" x="'+(PADL+cc*GC)+'" y="'+TOP+'" width="'+GC+'" height="'+H+'" fill="transparent" style="cursor:pointer"/>';
      }
    }

    s += '</svg>';
    return s;
  }

  /* =========================================================
     はなまる／ばつ／メッセージ
     ========================================================= */
  var maru = document.getElementById('maru'),
      batsu = document.getElementById('batsu'),
      seikai = document.getElementById('seikai'),
      fb = document.getElementById('fb'),
      ans = document.getElementById('ans');

  var maruTimer=null, batsuTimer=null;
  function showMaru(){
    hideBatsu();
    maru.classList.remove('show'); void maru.offsetWidth; maru.classList.add('show');
    try{ seikai.currentTime=0; seikai.play(); }catch(e){}
    if(maruTimer) clearTimeout(maruTimer);
    maruTimer = setTimeout(function(){ maru.classList.remove('show'); maruTimer=null; }, 1000);
  }
  function hideMaru(){ if(maruTimer){ clearTimeout(maruTimer); maruTimer=null; } maru.classList.remove('show'); }
  function showBatsu(){
    hideMaru();
    CH.miss();
    batsu.classList.remove('show'); void batsu.offsetWidth; batsu.classList.add('show');
    if(batsuTimer) clearTimeout(batsuTimer);
    batsuTimer = setTimeout(function(){ batsu.classList.remove('show'); batsuTimer=null; }, 1000);
  }
  function hideBatsu(){ if(batsuTimer){ clearTimeout(batsuTimer); batsuTimer=null; } batsu.classList.remove('show'); }
  var autoTimer=null, judgeTimer=null;
  function cancelAuto(){
    if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }
    if(judgeTimer){ clearTimeout(judgeTimer); judgeTimer=null; }
  }
  // 答えが入ってから 一瞬おいて ◯✗ を出す
  function judge(fn, ms){
    if(judgeTimer) clearTimeout(judgeTimer);
    judgeTimer = setTimeout(function(){ judgeTimer=null; fn(); }, (ms===undefined)?600:ms);
  }
  // いま開いている タブの「つぎの問題」
  function nextAny(){
    if(mode==='shikumi') nextShikumi();
    else if(mode==='make') nextMake();
    else if(mode==='nl') nextNL();
    else if(mode==='mul') nextMul();
    else if(mode==='fude') nextFude();
    else if(mode==='big') nextBig();
    else if(mode==='flash') flNew();
  }
  function scheduleNext(){
    cancelAuto();
    // チャレンジ中は 数を かぞえてから 進む（次に進めるのは チャレンジ側）
    if(CH.isOn()){ CH.done(); return; }
    // はなまるは 1秒で 消える。そのあと 2.2秒ほど 今の 問題を 見せてから つぎへ
    autoTimer = setTimeout(function(){ autoTimer=null; nextAny(); }, 3200);
  }
  function setFb(msg, cls){ fb.textContent = msg; fb.className = 'fb ' + (cls||''); }
  function clearAll(){ ans.value=''; setFb('',''); hideMaru(); hideBatsu(); }

  /* =========================================================
     ① 位（くらい）モード
     ========================================================= */
  /* sType … このタブの中の 3つの 問題。'q1'＝何の位／'q3'＝何が何こ／'w'＝数字で書く */
  var sType='q1', sRand=false;
  var kDigits='1429400000000', kMark=0, kHint=false,
      kChoice='', kRevealed=false, kFbMsg='', kFbCls='';

  function newKurai(){
    CH.newProblem();
    var len = rnd(10,13);
    var sig = Math.min(len, rnd(4,6));            // 上の何けたかだけ数字を入れる
    var ds = ''+rnd(1,9);
    for(var i=1;i<sig;i++) ds += rnd(0,9);
    for(var j=sig;j<len;j++) ds += '0';
    kDigits = ds;

    var sigIdx = [];                               // 数字が入っている位（右から）
    for(var p=len-1; p>=len-sig; p--) sigIdx.push(p);

    var cand = sigIdx.filter(function(p){ return kDigits.charAt(len-1-p) !== '0'; });
    kMark = pick(cand.length?cand:sigIdx);
    kChoice=''; kRevealed=false; kFbMsg=''; kFbCls='';
  }

  function kCorrect(){ return (sType==='q1') ? PLACE[kMark] : UNITV[kMark]; }
  function kCorrectText(){ return (sType==='q1') ? (PLACE[kMark]+'の位') : UNITV[kMark]; }

  function renderKurai(){
    var len = kDigits.length;
    var gEl = document.getElementById('kgrid');
    gEl.onclick = null;
    // マスは いつも 13（十兆の位まで）。数は 右づめ。
    // こうすると 3つの 問題で 位取り表の 場所も 大きさも そろう
    gEl.innerHTML = buildGrid({ cells:CN, digits:kDigits, units:kHint, mark:kMark });

    var q = document.getElementById('kq'), ch = document.getElementById('kchoices');
    var html = '', list = [];
    if(sType==='q1'){
      q.innerHTML = '▼の 数字（<span style="color:var(--arrow);font-weight:900">'+kDigits.charAt(len-1-kMark)+'</span>）は、何の位の 数字ですか。';
      for(var i=len-1;i>=0;i--) list.push({v:PLACE[i], t:PLACE[i]+'の位'});
      ch.className='pchoices';
    }else{
      var dg = kDigits.charAt(len-1-kMark);
      q.innerHTML = '▼の <span style="color:var(--arrow);font-weight:900">'+dg+'</span> は、何が '+dg+' こ あることを 表していますか。';
      for(var k=len-1;k>=0;k--) list.push({v:UNITV[k], t:UNITV[k]});
      ch.className='pchoices';
    }
    for(var n=0;n<list.length;n++){
      var on = (!kRevealed && list[n].v===kChoice) ? ' on' : '';
      html += '<button class="'+on.trim()+'" data-v="'+list[n].v+'">'+list[n].t+'</button>';
    }
    ch.innerHTML = html;
    Array.prototype.forEach.call(ch.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){
        cancelAuto();
        kChoice = b.getAttribute('data-v'); kRevealed=false;
        kFbMsg=''; kFbCls='';
        renderKurai();
        var ok = (kChoice === kCorrect());
        judge(function(){
          kFbMsg = ok ? '◯ せいかい！' : '✗ もういちど';
          kFbCls = ok ? 'ok' : 'ng';
          renderKurai();
          if(ok){ showMaru(); scheduleNext(); } else showBatsu();
        }, 450);
      });
    });

    var f = document.getElementById('kfb');
    if(kRevealed){ f.textContent = 'こたえ：'+kCorrectText(); f.className='cfb neutral'; }
    else { f.textContent = kFbMsg; f.className = 'cfb '+(kFbCls||''); }
    document.getElementById('sHintBtn').classList.toggle('on', kHint);
  }

  /* =========================================================
     位取り表に数字を入れる 共通しくみ（②③⑤で使用）
     ========================================================= */
  var CN = 13;
  // st.n = マスの数（省略すると13）。「数をつくる」タブでは 8〜10 に かえて 使う
  function ciMake(n){ var st={cells:[],sel:-1,done:false,n:(n||CN)}; ciReset(st); return st; }
  function ciReset(st,n){
    if(n) st.n = n;
    st.cells=[]; for(var i=0;i<st.n;i++) st.cells.push('');
    st.sel = (st.home===undefined) ? -1 : st.home;   // home が あれば そこを えらんだ ままに
    st.done=false;
  }
  function ciLeft(st){ for(var i=0;i<st.n;i++){ if(st.cells[i]!=='') return i; } return -1; }
  function ciStr(st){
    var L=ciLeft(st); if(L<0) return null;
    var t='';
    for(var i=L;i<st.n;i++){ if(st.cells[i]==='') return null; t += st.cells[i]; }
    return t;
  }
  function ciSetValue(st,v){
    ciReset(st);
    var ds=String(v);
    for(var i=0;i<ds.length;i++) st.cells[st.n-ds.length+i]=ds.charAt(i);
    st.done=true; st.sel=-1;
  }
  function ciCheck(st,target,auto,render){
    var t=ciStr(st);
    if(t===null){ if(!auto) setFb('あいている 位が あるよ。0 を 入れよう','neutral'); return; }
    var verdict = function(){
      if(t===String(target)){ st.done=true; setFb('◯ せいかい！','ok'); render(); showMaru(); scheduleNext(); }
      else if(Number(t)===target){ setFb('✗ おしい！ 前の 0 は いりません','ng'); showBatsu(); }
      else { setFb('✗ もういちど（けた数と 0の数を たしかめよう）','ng'); showBatsu(); }
    };
    if(auto) judge(verdict); else verdict();
  }
  function ciFillZeros(st,target,render){
    if(st.done) return;
    var L=ciLeft(st);
    if(L<0){ setFb('さきに 数字を 入れる マスを タップしてね','neutral'); return; }
    for(var i=L+1;i<st.n;i++){ if(st.cells[i]==='') st.cells[i]='0'; }
    st.sel=-1; render(); ciCheck(st,target,true,render);
  }
  function ciKey(st,target,k,render){
    cancelAuto();
    if(k==='clear'){ ciReset(st); setFb('',''); render(); return; }
    if(st.done) return;
    if(k==='back'){
      if(st.sel<0) return;
      if(st.cells[st.sel]==='' && st.sel>0) st.sel--;
      st.cells[st.sel]=''; render(); return;
    }
    if(st.sel<0){ setFb('入れる マス（位）を タップしてね','neutral'); return; }
    var str=String(k);
    for(var i=0;i<str.length && st.sel<st.n;i++){ st.cells[st.sel]=str.charAt(i); st.sel++; }
    if(st.sel>=st.n) st.sel=-1;
    render(); ciCheck(st,target,true,render);
  }
  function ciGrid(gridId,st,units,render,hl){
    var gEl=document.getElementById(gridId);
    gEl.innerHTML = buildGrid({ cells:st.n, chars:st.cells, units:units, mark:-1,
                                sel:st.sel, click:!st.done, hl:hl });
    gEl.onclick = function(e){
      var t=e.target, i=(t && t.getAttribute) ? t.getAttribute('data-i') : null;
      if(i===null || i===undefined || st.done) return;
      cancelAuto(); st.sel=Number(i); setFb('',''); render();
    };
  }

  /* =========================================================
     ② 数字で書く（漢数字 → 数字）
     ========================================================= */
  var wVal=265000000, wHint=false, wHard=false, wRevealed=false;
  var stW = ciMake();

  // 4けたのまとまりをつくる（0がとびとびに入りやすい）
  function wGroup(zeroRate){
    var z = (zeroRate===undefined) ? 5 : zeroRate;   // 0になりやすさ（0〜9）
    var v = 0;
    for(var i=0;i<4;i++){ v = v*10 + ((rnd(0,9)<z) ? 0 : rnd(1,9)); }
    return v;
  }
  // 億・兆の きりのいい 数を 1つ つくる（②数字で書く と ⑨読み方 で 共用）
  function makeBigValue(hard){
    var v, t, o, m, guard=0;
    do{
      guard++;
      if(hard){
        // 兆の数（六兆七千二百四十八億／六兆三百八億四百万 など）
        t = rnd(1,9);
        o = (rnd(0,9)<2) ? 0 : wGroup(4);
        m = (rnd(0,9)<4) ? 0 : wGroup(6);
        v = t*1e12 + o*1e8 + m*1e4;
      }else{
        var kind = rnd(0,2);
        if(kind===0){        // 億と万（二億六千五百万／三億七十万 など）
          o = wGroup(4); if(o===0) o = rnd(1,9);
          m = (rnd(0,9)<3) ? 0 : wGroup(5);
          v = o*1e8 + m*1e4;
        }else if(kind===1){  // 億だけ（十二億／五千六十億 など）
          o = wGroup(4); if(o===0) o = rnd(1,9);
          v = o*1e8;
        }else{               // 万の数（三千二十万 など）
          m = wGroup(4); if(m<10) m = rnd(10,9999);
          v = m*1e4;
        }
      }
    }while(guard<20 && String(v).length<7);
    return v;
  }
  function newWrite(){
    CH.newProblem();
    wVal = makeBigValue(wHard); wHint = false; ciReset(stW);
  }

  function renderWrite(){
    // ヒントの ときは「兆・億・万」を 赤い ○で かこむ。まとまりが 見えて 読みやすい
    var wk = document.getElementById('wkanji');
    wk.innerHTML = markUnits(kanjiNum(wVal));
    wk.className = 'qbig' + (wHint ? ' hint' : '');
    ciGrid('wgrid', stW, wHint, renderWrite);          // いつも マスをクリック
    document.getElementById('wreveal').textContent = wRevealed ? ('こたえ：'+String(wVal)) : '';
    document.getElementById('sHintBtn').classList.toggle('on', wHint);
    ans.style.display = 'none';                        // 入力わくは 使わない
  }

  /* =========================================================
     ⑨ 読み方（数字 → 漢数字を えらぶ）
       まちがいの えらび肢は
        ・位が 1つ ずれた 数（10倍・1/10・100倍・1/100）
        ・どこかの まとまりの 0の数が ちがう 数
        ・億の まとまりと 万の まとまりが 入れかわった 数
       から つくる。
     ========================================================= */
  var rVal=0, rList=[], rAns='', rPickIdx=-1, rHint=false, rRevealed=false,
      rFbMsg='', rFbCls='';

  function rMakeList(v){
    var t=Math.floor(v/1e12), o=Math.floor(v/1e8)%10000, m=Math.floor(v/1e4)%10000, r=v%10000;
    function reg(a,b,c,d){ return a*1e12 + b*1e8 + c*1e4 + d; }
    var cand=[], i, j, tmp;
    cand.push(v*10);                                   // 位が 1つ 左
    if(v%10===0) cand.push(v/10);                      // 位が 1つ 右
    if(m){ if(m<1000) cand.push(reg(t,o,m*10,r)); if(m%10===0) cand.push(reg(t,o,m/10,r)); }
    if(o){ if(o<1000) cand.push(reg(t,o*10,m,r)); if(o%10===0) cand.push(reg(t,o/10,m,r)); }
    if(t){ if(t<1000) cand.push(reg(t*10,o,m,r)); }
    if(o && m && o!==m) cand.push(reg(t,m,o,r));       // 億と万の 入れかえ
    cand.push(v*100);
    if(v%100===0) cand.push(v/100);
    for(i=cand.length-1;i>0;i--){ j=rnd(0,i); tmp=cand[i]; cand[i]=cand[j]; cand[j]=tmp; }

    var right=kanjiNum(v), out=[right], seen={}; seen[right]=1;
    for(i=0;i<cand.length && out.length<4;i++){
      var c=cand[i];
      if(!(c>0) || c>=1e16) continue;
      var s2=kanjiNum(c);
      if(seen[s2]) continue;
      seen[s2]=1; out.push(s2);
    }
    for(i=out.length-1;i>0;i--){ j=rnd(0,i); tmp=out[i]; out[i]=out[j]; out[j]=tmp; }
    return { list:out, ans:right };
  }

  function newRead(){
    CH.newProblem();
    rVal = makeBigValue(wHard);
    var o2 = rMakeList(rVal);
    rList = o2.list; rAns = o2.ans;
    rPickIdx=-1; rHint=false; rRevealed=false; rFbMsg=''; rFbCls='';
  }

  function renderRead(){
    document.getElementById('rgrid').innerHTML =
      buildGrid({ cells:CN, digits:String(rVal), units:rHint, mark:-1 });

    var ch=document.getElementById('rchoices'), html='';

    }

    Array.prototype.forEach.call(ch.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){

    else { f.textContent = rFbMsg; f.className = 'cfb '+(rFbCls||''); }
    document.getElementById('sHintBtn').classList.toggle('on', rHint);
  }

  /* =========================================================
     ③ あわせた数・あつめた数
     ========================================================= */
  var mType='m1', mRand=false, mHint=false, mRevealed=false;
  var mText='', mAnswer=0, mIsCount=false;
  var mUnit=false, mHintTx='';        // mUnit＝こたえを「◯億」の 形で 書く問題
  var stM = ciMake();
  /* ヒントで 使う もの
       mHL   … 赤い しかく。{ base:きじゅんの位, top:こたえの いちばん上の位 }
               「1億を830こ」なら base＝一億の位、top＝百億の位（830は 3けた だから）
       mBase … 「□こ」で 位取り表に 入れて 見せる 数（4億 など）
       mA4/mB4/mOp/mUn … たし算・ひき算の 筆算に 使う 数・しるし・単位  */
  var mHL=null, mBase=0, mA4=0, mB4=0, mOp='＋', mUn='億';

  function newMake(){
    CH.newProblem();
    mUnit=false; mHintTx=''; mHL=null; mBase=0;
    var t = mType;
    if(t==='m1'){                     // 1兆を6こ、10億を4こ あわせた数
      var i1 = pick([12,11,10,9,8]);
      var lower = [];
      for(var k=i1-1; k>=Math.max(4,i1-4); k--) lower.push(k);
      var i2 = pick(lower);
      var a = rnd(1,9), b = rnd(1,9);
      mText = UNITV[i1]+' を '+a+' こ、'+UNITV[i2]+' を '+b+' こ あわせた数';
      mAnswer = a*pow10(i1) + b*pow10(i2);
      mIsCount = false;               // 赤い しかくは なし（ヒントは 位の 名前だけ）
    }else if(t==='m2'){               // 1億を180こ、1万を370こ 集めた数
      var i3 = pick([8,4]);           // 一億の位 か 一万の位 から
      var c;
      if(i3===8){                     // 1億を □こ（2〜999こ）
        c = (rnd(0,9)<6) ? rnd(11,99)*10 : rnd(101,999);
      }else{                          // 1万を □こ（2〜9999こ）
        c = (rnd(0,9)<6) ? rnd(11,999)*10 : rnd(101,9999);
      }
      mText = UNITV[i3]+' を '+c+' こ 集めた数';
      mAnswer = c*pow10(i3);
      // 1億を 830こ なら こたえは 830億。3けた ぶん 上の 百億の位まで かこむ
      mHL = { base:i3, top:i3 + String(c).length - 1 };
      mIsCount = false;
    }else if(t==='m3'){               // 70億は 10億を □こ 集めた数
      var i4 = pick([11,10,9,8,7]);
      var cnt = (rnd(0,1)===0) ? rnd(2,9)*10 : rnd(2,99);
      var val = cnt*pow10(i4);
      mText = bigLabel(val)+' は、'+UNITV[i4]+' を □ こ 集めた数です。□ に 入る 数は？';
      mAnswer = cnt;
      mBase = val;                    // ヒントで 位取り表に 入れて 見せる 数
      // 4億 は 1000万を 40こ。40は 2けた なので 千万の位から 一億の位まで
      mHL = { base:i4, top:i4 + String(cnt).length - 1 };
      mIsCount = true;
    }else{                            // 億・兆を 単位に した たし算・ひき算
      var u4 = (rnd(0,9)<7) ? 8 : 12;              // 億が 多め
      var un = (u4===8) ? '億' : '兆';
      var s4 = rnd(0,3);
      if(u4===12 && s4===3) s4 = 2;                // 兆で 4けたは 大きすぎる
      var a4, b4;
      if(s4===0){ a4=rnd(2,9);      b4=rnd(1,9); }        // 5億 ＋ 3億
      else if(s4===1){ a4=rnd(2,9)*10;   b4=rnd(1,9)*10; }     // 80億 ＋ 40億
      else if(s4===2){ a4=rnd(11,99);    b4=rnd(11,99); }      // 47億 ＋ 26億
      else{ a4=rnd(1,9)*1000; b4=rnd(1,9)*1000; }              // 8000億 ＋ 4000億 → 1兆2000億
      var plus = (rnd(0,1)===0), sign = plus ? ' ＋ ' : ' － ', sw;
      if(!plus){
        if(a4<b4){ sw=a4; a4=b4; b4=sw; }
        if(a4===b4) a4 += (s4===3) ? 1000 : (s4===1 ? 10 : 1);
      }
      mText   = a4+un+sign+b4+un+' ＝';
      mAnswer = (plus ? a4+b4 : a4-b4) * pow10(u4);
      mA4 = a4; mB4 = b4; mOp = plus ? '＋' : '－'; mUn = un;   // ヒントの 筆算に 使う
      mHintTx = '1'+un+' が （'+a4+sign+b4+'） こ ぶん。';
      mIsCount = true; mUnit = true;
    }
    mHint=false; mRevealed=false; ciReset(stM);
  }

  /* たし算・ひき算の ヒント。「70 ＋ 67」の 形に たてに そろえた 筆算を かく。
     こたえは 書かない（線の 下は 空けておく）ので、答えは 自分で 出す  */
  function mFudeSvg(){
    var sa = String(mA4), sb = String(mB4);
    var n = Math.max(sa.length, sb.length);
    var CW = 44, PADX = 10, SW = 46, UW = 46;        // マスのはば・よはく・しるし・単位
    var right = PADX + SW + n*CW;                    // 数字の 右はし
    var VW = right + UW + PADX, VH = 186;
    var y1 = 54, y2 = 112, ly = 130;                 // 1だんめ・2だんめ・よこ線
    var s = '<svg viewBox="0 0 '+VW+' '+VH+'" xmlns="http://www.w3.org/2000/svg">';
    function row(str, y){
      for(var i=0;i<str.length;i++){
        var x = right - (str.length-i)*CW + CW/2;
        s += '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="46" font-weight="800" fill="var(--ink)">'+
             str.charAt(i)+'</text>';
      }
      // 右はしに 単位（億 か 兆）。何の まとまりを たしているかが 見える
      s += '<text x="'+(right+UW/2)+'" y="'+y+'" text-anchor="middle" font-size="36" font-weight="800" fill="var(--ink)">'+
           mUn+'</text>';
    }
    row(sa, y1);
    row(sb, y2);
    s += '<text x="'+(PADX+SW/2)+'" y="'+y2+'" text-anchor="middle" font-size="44" font-weight="800" fill="var(--ink)">'+
         mOp+'</text>';
    s += '<line x1="'+PADX+'" y1="'+ly+'" x2="'+right+'" y2="'+ly+'" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>';
    s += '</svg>';
    return s;
  }

  function renderMake(){
    var q = document.getElementById('mq');
    q.textContent = mText;
    q.className = 'qbig' + (mUnit ? ' big' : '');    // たし算・ひき算は 大きい字で
    var g = document.getElementById('mgrid'), sp = document.getElementById('mspace');
    if(mIsCount){
      g.innerHTML=''; g.onclick=null;
      if(mType==='m3'){
        // 「□こ」は もとの 数を 入れた 位取り表を はじめから 見せる。
        // ヒントで 赤い しかくと 位の 名前が つく（場所とりの 表と 同じ 大きさ）
        sp.innerHTML = buildGrid({ cells:CN, digits:String(mBase), units:mHint,
                                   hl:(mHint ? mHL : null), mark:-1 });
        sp.setAttribute('aria-hidden','false');
      }else{
        // 位取り表を 使わない 問題でも、同じ 高さを 下に あけておく。
